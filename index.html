<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RésiTerre</title>
<meta name="author" content="Mahel Chéour">
<meta name="description" content="RésiTerre, diagnostic de vulnérabilité territoriale conçu et développé par Mahel Chéour, géographe des risques et SIG. Croise les études officielles bâtiment par bâtiment.">
<meta property="og:title" content="RésiTerre, par Mahel Chéour">
<meta property="og:description" content="Diagnostic multirisque des territoires à partir des études officielles, avec les projections climatiques à 2040.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
/* Outil d'aide à la décision : panneau d'analyse à gauche, carte 2D / 3D à droite. */
:root {
  --bg: #f5f6f3; --panel: #ffffff; --ink: #18211f; --ink-2: #435049; --ink-3: #6c7871;
  --line: #dde2de; --line-2: #eef1ee; --accent: #0f5b4f; --accent-soft: #e1eeea; --on-accent: #ffffff;
  --warn-bg: #fbf0dc; --warn-ink: #6d4810;
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111715; --panel: #18201d; --ink: #e8eeea; --ink-2: #b9c4be; --ink-3: #8a968f;
    --line: #2b3632; --line-2: #222b28; --accent: #5cc0a8; --accent-soft: #1d3530; --on-accent: #0d1a17;
    --warn-bg: #3a2e18; --warn-ink: #f2d29a; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
#app { display: grid; grid-template-columns: 460px 1fr; height: 100%; }
#side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
#mapwrap { position: relative; min-width: 0; }
#map, #map3d { position: absolute; inset: 0; background: var(--line-2); }

header.top { padding: 14px 18px 10px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--ink-3); font-size: 12.5px; }
.searchrow { display: flex; gap: 8px; position: relative; }
.searchrow input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.searchrow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#suggest { position: absolute; top: 42px; left: 0; right: 0; z-index: 1000; list-style: none; margin: 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.12); }
#suggest li { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
#suggest li:hover { background: var(--accent-soft); }
#suggest small { color: var(--ink-3); margin-left: 6px; }
.btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:focus-visible, .tabs button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.credit { font-size: 11.5px; color: var(--ink-3); padding: 8px 18px; border-top: 1px solid var(--line); }
.credit b { color: var(--ink-2); font-weight: 600; }
.mail { user-select: all; }
.brand a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 2px; }
.status { font-size: 12.5px; color: var(--ink-3); min-height: 18px; }

.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 10px 9px; cursor: pointer; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
#content { flex: 1; overflow-y: auto; padding: 16px 18px 28px; min-height: 0; }
#content h2 { font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
#content h3 { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; font-weight: 600; }
#content p { margin: 0 0 10px; }
.lead { color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--line-2); border-radius: 8px; padding: 9px 11px; margin-top: 12px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }

.keys { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 4px; }
.key { display: grid; grid-template-columns: 6px 1fr; gap: 10px; padding: 8px 10px; background: var(--line-2); border-radius: 8px; font-size: 13px; }
.key i { border-radius: 3px; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 10px; margin-top: 12px; }
.dial { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; }
.dial div { width: 62px; height: 62px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-family: var(--mono); font-size: 19px; font-weight: 500; }
.hero strong { display: block; font-size: 15px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.kpi { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.kpi b { display: block; font-family: var(--mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi span { font-size: 11.5px; color: var(--ink-3); }

.fam { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.fam .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fam .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.fam .t i { width: 10px; height: 10px; border-radius: 3px; }
.fam .n { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.fam .s { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line-2); margin-top: 7px; }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 150px 1fr 54px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .tr { height: 9px; background: var(--line-2); border-radius: 5px; overflow: hidden; }
.bar .fl { height: 100%; border-radius: 5px; }
.bar .v { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.act { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 9px; }
.act .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.act .t { font-weight: 600; }
.act .num { font-family: var(--mono); font-size: 18px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.act .why { font-size: 12.5px; color: var(--ink-2); margin: 4px 0 6px; }
.act ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
.act .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.prio { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }

.clim { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); align-items: center; }
.clim .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.clim .v b { font-weight: 500; }
.clim small { color: var(--ink-3); font-size: 11.5px; grid-column: 1 / -1; }
.delta { font-size: 11.5px; padding: 1px 6px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); margin-left: 4px; }
.cross { border-left: 3px solid var(--accent); padding: 6px 0 6px 11px; margin: 10px 0; }
.cross b { display: block; }

.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); padding: 6px 4px; }
td { border-bottom: 1px solid var(--line-2); padding: 6px 4px; vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--accent-soft); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--line-2); color: var(--ink-2); margin: 2px 4px 0 0; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.ko { background: var(--warn-bg); color: var(--warn-ink); }

.layer { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.layer input { margin-top: 3px; accent-color: var(--accent); }
.layer label { cursor: pointer; }
.layer small { display: block; color: var(--ink-3); font-size: 11.5px; }
.src { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }

.maptools { position: absolute; top: 12px; right: 12px; left: 12px; z-index: 700; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
.maptools > * { pointer-events: auto; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.seg button { border: 0; background: none; padding: 6px 10px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--ink); color: var(--panel); }
.lens { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); font-size: 12px; }
.lens select { border: 0; background: var(--line-2); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; font-weight: 600; }
.right { display: flex; gap: 8px; }
.legend { position: absolute; left: 12px; bottom: 22px; z-index: 700; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); max-width: 250px; }
.legend h4 { margin: 0 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.legend div { display: flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 10px; border-radius: 3px; flex: none; }
.focusbar { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 700; background: var(--ink); color: var(--panel); border-radius: 18px; padding: 6px 8px 6px 14px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.focusbar button { border: 0; background: var(--panel); color: var(--ink); border-radius: 12px; padding: 3px 9px; cursor: pointer; font-size: 12px; }
.busy { position: absolute; inset: 0; z-index: 800; display: grid; place-items: center; pointer-events: none; }
.busy > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.14); font-size: 13px; min-width: 280px; }
.busy ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-3); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.leaflet-popup-content, .maplibregl-popup-content { font-family: var(--sans); font-size: 12.5px; }
.leaflet-popup-content { margin: 10px 12px; width: 300px !important; }
.maplibregl-popup-content { padding: 10px 12px; width: 324px; color: #18211f; }
.fiche h5 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; }
.fiche .sub { color: #6c7871; margin-bottom: 8px; }
.fiche .sec { margin-top: 9px; }
.fiche .sec > b { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: #6c7871; margin-bottom: 3px; }
.fiche ul { margin: 0; padding-left: 16px; }
.fiche li { margin: 2px 0; }
.fiche .lv { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; margin-left: 4px; }
.fiche dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
.fiche dt { color: #6c7871; }
.fiche dd { margin: 0; }
.fiche .scroll { max-height: 300px; overflow-y: auto; padding-right: 4px; }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 50% 50%; }
  #side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .bar { grid-template-columns: 110px 1fr 46px; }
  .lens { font-size: 0; gap: 0; padding-left: 4px; }
  .lens select { font-size: 12.5px; }
  .leaflet-popup-content { width: 250px !important; }
  .maplibregl-popup-content { width: 270px; }
}
</style>
</head>

<div id="app">
  <aside id="side">
    <header class="top">
      <div class="brand"><h1>RésiTerre</h1><span>Diagnostic de vulnérabilité territoriale · par <a href="#" id="about-link">Mahel Chéour</a></span></div>
      <div class="searchrow">
        <input id="q" type="search" placeholder="Commune ou adresse, par exemple Arles" autocomplete="off" aria-label="Rechercher une commune ou une adresse">
        <button class="btn primary" id="run">Analyser la vue</button>
        <ul id="suggest" hidden></ul>
      </div>
      <div class="status" id="status"></div>
    </header>
    <nav class="tabs" role="tablist">
      <button data-tab="synthese" class="on">Synthèse</button>
      <button data-tab="actions">Actions</button>
      <button data-tab="climat">Climat 2040</button>
      <button data-tab="bati">Bâtiments</button>
      <button data-tab="etudes">Études</button>
      <button data-tab="couches">Couches</button>
      <button data-tab="methode">Méthode</button>
    </nav>
    <div id="content"></div>
    <footer class="credit">Conçu et développé par <b>Mahel Chéour</b>, géographe des risques et SIG · <span class="mail">mahelchr@gmail.com</span></footer>
  </aside>

    <div id="map"></div>
    <div id="map3d" hidden></div>
    <div class="maptools">
      <label class="lens">Lecture
        <select id="lens">
          <option value="multi">Multirisque</option>
          <option value="inond">Inondation</option>
          <option value="feu">Feu de forêt</option>
          <option value="sol">Sols et argiles</option>

        <div class="seg" id="dims"><button data-d="2d" class="on">2D</button><button data-d="3d">3D</button></div>
        <div class="seg" id="basemaps"><button data-b="plan" class="on">Plan</button><button data-b="ortho">Photo</button></div>
      </div>

    <div class="focusbar" id="focusbar" hidden><span id="focust"></span><button id="focusx">Tout afficher</button></div>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
'use strict';
/* =====================================================================
   RésiTerre : diagnostic de vulnérabilité territoriale.
   Croise, bâtiment par bâtiment, les études et inventaires publics :
   IGN (BD TOPO, débroussaillement, Vigicrues), Géoportail de l'urbanisme
   (PPR), BRGM (argiles, cavités, mouvements, sismicité), INSEE,
   et les projections climatiques CMIP6 (Open-Meteo).
   Puis traduit les résultats en priorités d'action.
   ===================================================================== */

const HH = 2.2;         // personnes par logement (taille moyenne des ménages, INSEE)
const MAX_KM2 = 16;     // emprise maximale analysée
const R_NEAR = 50, R_FAR = 150;   // rayons d'influence cavités et mouvements (m)
const R_FOREST = [20, 50, 200];   // distances à la forêt (m) : très proche, proche, interface

const FAM = {
  inond: { lbl: 'Inondation', col: '#2f78bf', pal: ['#cfd4d1', '#cde1f2', '#8bbbe3', '#3a82c4', '#163f78'] },
  feu:   { lbl: 'Feu de forêt', col: '#d0532c', pal: ['#cfd4d1', '#f7dcc2', '#f0a66d', '#d5622f', '#8a2a14'] },
  sol:   { lbl: 'Sols et argiles', col: '#97703f', pal: ['#cfd4d1', '#ece2cc', '#d4b685', '#a77b43', '#694520'] },
  tech:  { lbl: 'Industriel', col: '#7257ad', pal: ['#cfd4d1', '#e4ddf1', '#bba8de', '#8564b8', '#4c3280'] },
};
const MULTI_PAL = ['#cfd4d1', '#f2df93', '#e8a748', '#cc5a34', '#7e2231'];
const POP_PAL = ['#cfd4d1', '#e3e9f3', '#a9b9de', '#6378bd', '#2a3a86'];
const LV = ['Non concerné', 'Faible', 'Modéré', 'Fort', 'Très fort'];
const POP_LV = ['Non exposé ou inhabité', '1 à 5 habitants', '5 à 20 habitants', '20 à 50 habitants', 'Plus de 50 habitants'];

const GROUPS = [
  { id: 'enseignement', lbl: 'Écoles et crèches', re: /enseignement|coll[èe]ge|lyc[ée]e|[ée]cole|cr[èe]che|universit/i },
  { id: 'sante', lbl: 'Santé et maisons de retraite', re: /h[ôo]pital|clinique|maison de retraite|ehpad|sant[ée]|[ée]tablissement thermal|m[ée]dico/i },
  { id: 'crise', lbl: 'Gestion de crise (mairie, secours, police)', re: /mairie|police|gendarmerie|pompiers|caserne|pr[ée]fecture|sous-pr[ée]fecture/i },
  { id: 'camping', lbl: 'Campings', re: /camping/i },
];

/* ---------- Utilitaires ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
const fmt = (v, d) => (v == null || isNaN(v) ? '–' : (d ? nf1 : nf).format(v));
const plural = (n, s, p) => `${fmt(n)} ${n > 1 ? (p || s + 's') : s}`;

async function getJSON(url, timeout = 45000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), timeout);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (r.status === 429) throw new Error('trop de requêtes, réessayez dans une minute');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : { type: 'FeatureCollection', features: [] };
  } finally { clearTimeout(t); }
}

/* ---------- Géométrie (coordonnées lon/lat, distances en mètres) ---------- */
const polysOf = (g) => (!g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []);
function inRing(x, y, r) {
  let ins = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function inPolys(x, y, polys) {
  for (const p of polys) {
    if (!inRing(x, y, p[0])) continue;
    let hole = false;
    for (let k = 1; k < p.length; k++) if (inRing(x, y, p[k])) { hole = true; break; }
    if (!hole) return true;
  }
  return false;
}
function bboxOf(g) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;

const KX = (lat) => 111320 * Math.cos(lat * Math.PI / 180);

/* ---------- Zonages locaux publiés sur la Géoplateforme ----------
   Les services de l'État et les collectivités y publient des zonages précis
   (zones rouges et bleues des PPR au standard CNIG, aléas feu de forêt, etc.).
   La liste évolue : on la découvre à chaque analyse dans le catalogue du service,
   et on retient les couches liées aux risques dont l'emprise recoupe le secteur. */
let CAPS = null;
const RISK_RE = /zone_reg|ppr[nimtlsf]|ppri|pprt|dfci|al[ée]a|inond|submer|crue|ruissel|tri_|risque|mouvement|cavit|argil|feu de for|incendie/i;
async function geopfCatalog() {
  if (CAPS) return CAPS;
  const r = await fetch('https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities');
  const t = await r.text();
  CAPS = [...t.matchAll(/<FeatureType[\s\S]*?<\/FeatureType>/g)].map((m) => {
    const x = m[0];
    const lc = (x.match(/<ows:LowerCorner>([^<]+)<\/ows:LowerCorner>/) || [])[1], uc = (x.match(/<ows:UpperCorner>([^<]+)<\/ows:UpperCorner>/) || [])[1];
    const a = lc ? lc.split(' ').map(Number) : null, b = uc ? uc.split(' ').map(Number) : null;
    return { name: (x.match(/<Name>([^<]+)/) || [])[1], title: ((x.match(/<Title>([^<]+)/) || [])[1] || '').replace(/&#39;/g, "'").replace(/&amp;/g, '&'), bb: a && b ? [a[0], a[1], b[0], b[1]] : null };
  }).filter((f) => f.name && RISK_RE.test(f.name + ' ' + f.title) && !/patrinat|vigicrues|viginond|debroussaillement|carro_dfci|conservatoire/i.test(f.name));
  return CAPS;
}
function localFamily(txt) {
  if (/dfci|feu|incend/i.test(txt)) return 'feu';
  if (/pprt|techno|industri/i.test(txt)) return 'tech';
  if (/mouvement|cavit|argil|terrain|carri|[ée]boul|glissement/i.test(txt)) return 'sol';
  return 'inond';
}
function localLevel(p) {
  const code = String(p.codezone || p.code_zone || p.zone || p.typezone || '').trim().toUpperCase();
  if (/^R/.test(code)) return [3, `zone rouge ${code}`];
  if (/^B/.test(code)) return [2, `zone bleue ${code}`];
  const txt = Object.values(p).filter((v) => typeof v === 'string').join(' ').toLowerCase();
  if (/tr[èe]s fort|exceptionnel/.test(txt)) return [4, 'aléa très fort'];
  if (/\bfort|\bélevé|\beleve/.test(txt)) return [3, 'aléa fort'];
  if (/moyen|modéré|modere/.test(txt)) return [2, 'aléa moyen'];
  if (/faible/.test(txt)) return [1, 'aléa faible'];
  return [2, p.nom || p.libelle || 'zone réglementée'];
}
async function fetchLocalStudies(bb) {
  const cat = await geopfCatalog();
  const hit = cat.filter((f) => f.bb && f.bb[0] <= bb[2] && f.bb[2] >= bb[0] && f.bb[1] <= bb[3] && f.bb[3] >= bb[1]).slice(0, 12);
  const out = [];
  await Promise.all(hit.map(async (l) => {
    try {
      const j = await getJSON(GEOPF(l.name, bb, '&COUNT=3000'), 60000);
      for (const f of j.features || []) {
        if (!f.geometry || !/Polygon/.test(f.geometry.type)) continue;
        const [lv, lab] = localLevel(f.properties || {});
        f.properties = { ...f.properties, _title: l.title, _layer: l.name, _fam: localFamily(l.name + ' ' + l.title), _lv: lv, _lab: lab };
        out.push(f);
      }
    } catch (e) { /* couche indisponible : on continue avec les autres */ }
  }));
  return out;
}

/* ---------- Études publiées sur data.gouv.fr pour la commune ---------- */
const STUDY_RE = /risque|pprn|ppri|pprt|pprif|pprl|pprmt|inond|submersion|crue|al[ée]a|zone r[ée]glement|atlas des zones|tri\b|territoire.{0,4}risque|mouvement de terrain|cavit|argile|feu de for|incendie|dicrim|catastrophe|ruissellement|s[ée]isme|littoral|recul/i;
async function fetchCatalogue(bb) {
  const c = await getJSON(`https://geo.api.gouv.fr/communes?lat=${(bb[1] + bb[3]) / 2}&lon=${(bb[0] + bb[2]) / 2}&fields=nom,code,departement&format=json`);
  const com = c[0];
  if (!com) return [];
  const qs = [`${com.nom} risques`, `${com.nom} inondation`, `${com.nom} prévention`, `${com.code}`];
  const seen = new Map();
  const res = await Promise.all(qs.map((q) => getJSON(`https://www.data.gouv.fr/api/1/datasets/?q=${encodeURIComponent(q)}&page_size=20`).catch(() => ({ data: [] }))));
  const nomRe = new RegExp(com.nom.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '.?'), 'i');
  for (const r of res) for (const d of r.data || []) {
    const txt = (d.title + ' ' + (d.description || '').slice(0, 400));
    const plain = txt.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (!STUDY_RE.test(txt)) continue;
    if (!nomRe.test(plain) && !plain.includes(com.code)) continue;
    if (!seen.has(d.id)) seen.set(d.id, { id: d.id, title: d.title, org: d.organization ? d.organization.name : (d.owner ? 'Particulier' : ''), page: d.page, maj: (d.last_update || d.last_modified || '').slice(0, 10), fam: localFamily(d.title) });
  }
  return [...seen.values()].sort((a, b) => (b.maj || '').localeCompare(a.maj || ''));
}

/* ---------- Climat futur ---------- */
// Un seul modèle et deux périodes de 20 ans : l'API gratuite d'Open-Meteo compte les requêtes au volume de données.
const CL_MODELS = ['EC_Earth3P_HR'];
const CL_VARS = ['temperature_2m_max', 'temperature_2m_min', 'precipitation_sum', 'relative_humidity_2m_min', 'soil_moisture_0_to_10cm_mean'];
const CL_PER = { ref: [2001, 2020], fut: [2031, 2050] };
async function fetchClimate(lon, lat) {
  // Le modèle a une maille d'environ 25 km : on réutilise le résultat dans un rayon de quelques kilomètres
  const glon = Math.round(lon * 10) / 10, glat = Math.round(lat * 10) / 10;
  const key = `rt-clim2-${glon}-${glat}`;
  try { const c = localStorage.getItem(key); if (c) return JSON.parse(c); } catch (e) { /* stockage indisponible */ }
  const url = (a, b) => `https://climate-api.open-meteo.com/v1/climate?latitude=${glat}&longitude=${glon}&start_date=${a}-01-01&end_date=${b}-12-31&models=${CL_MODELS.join(',')}&daily=${CL_VARS.join(',')}`;
  const ref = await getJSON(url(...CL_PER.ref), 90000);
  const fut = await getJSON(url(...CL_PER.fut), 90000);
  const daily = {};
  for (const k of Object.keys(ref.daily)) daily[k] = ref.daily[k].concat(fut.daily[k] || []);
  const res = computeClimate({ daily });
  try { localStorage.setItem(key, JSON.stringify(res)); } catch (e) { /* stockage plein ou indisponible */ }
  return res;
}
// Indicateurs annuels moyens, période de référence 2001-2020 et horizon 2031-2050.
const CL_IND = [
  { id: 'j30', lbl: 'Jours chauds', unit: 'j/an', desc: 'Température maximale de 30 °C ou plus' },
  { id: 'j35', lbl: 'Jours de très forte chaleur', unit: 'j/an', desc: 'Température maximale de 35 °C ou plus', d: 1 },
  { id: 'nt', lbl: 'Nuits tropicales', unit: 'nuits/an', desc: 'Température minimale de 20 °C ou plus : le corps ne récupère plus', d: 1 },
  { id: 'can', lbl: 'Jours de canicule', unit: 'j/an', desc: 'Maximale de 33 °C ou plus et minimale de 20 °C ou plus', d: 1 },
  { id: 'rr20', lbl: 'Jours de pluie intense', unit: 'j/an', desc: '20 mm ou plus en une journée', d: 1 },
  { id: 'rx1', lbl: 'Pluie journalière maximale', unit: 'mm', desc: 'Moyenne du cumul le plus fort de chaque année' },
  { id: 'sec', lbl: 'Jours de sol sec', unit: 'j/an', desc: 'Humidité du sol sous le niveau des 10 % les plus secs de 2001-2020' },

const IND_VARS = { j30: ['tx'], j35: ['tx'], nt: ['tn'], can: ['tx', 'tn'], rr20: ['pr'], rx1: ['pr'], sec: ['sm'], feu: ['tx', 'rh'] };
function computeClimate(j) {
  const t = j.daily.time;
  const yr = t.map((d) => +d.slice(0, 4));
  const out = { models: [], ind: {}, per: CL_PER };
  CL_IND.forEach((i) => { out.ind[i.id] = { ref: [], fut: [] }; });
  for (const m of CL_MODELS) {
    const g = (v) => (j.daily[`${v}_${m}`] || j.daily[v] || []);
    const V = { tx: g('temperature_2m_max'), tn: g('temperature_2m_min'), pr: g('precipitation_sum'), rh: g('relative_humidity_2m_min'), sm: g('soil_moisture_0_to_10cm_mean') };
    const has = Object.fromEntries(Object.entries(V).map(([k, v]) => [k, v.some((x) => x != null)]));
    if (!has.tx) continue;
    out.models.push(m);
    const [ra, rb] = CL_PER.ref;
    const refSm = V.sm.filter((v, i) => v != null && yr[i] >= ra && yr[i] <= rb).sort((a, b) => a - b);
    const p10 = refSm.length ? refSm[Math.floor(refSm.length * 0.1)] : null;
    for (const per of ['ref', 'fut']) {
      const [a, b] = CL_PER[per], n = b - a + 1;
      const c = { j30: 0, j35: 0, nt: 0, can: 0, rr20: 0, rx1: 0, sec: 0, feu: 0 };
      const ymax = {};
      for (let i = 0; i < t.length; i++) {
        if (yr[i] < a || yr[i] > b) continue;
        const x = V.tx[i], y = V.tn[i], p = V.pr[i], h = V.rh[i], sm = V.sm[i];
        if (x >= 30) c.j30++;
        if (x >= 35) c.j35++;
        if (y >= 20) c.nt++;
        if (x >= 33 && y >= 20) c.can++;
        if (p >= 20) c.rr20++;
        if (p != null) ymax[yr[i]] = Math.max(ymax[yr[i]] || 0, p);
        if (p10 != null && sm != null && sm < p10) c.sec++;
        if (x >= 30 && h != null && h <= 30) c.feu++;
      }
      const ys = Object.values(ymax);
      c.rx1 = ys.length ? ys.reduce((s, v) => s + v, 0) / ys.length * n : 0;
      // Un indicateur dont une variable manque est laissé vide plutôt qu'affiché à zéro
      for (const k of Object.keys(c)) if (IND_VARS[k].every((v) => has[v])) out.ind[k][per].push(c[k] / n);
    }
  }
  return out;
}

function assess(c) {
  const r = { ppr: [], arg: 0, old: false, vigi: 0, vigiSt: null, forest: Infinity, forestType: null, cav: [], mvt: [], fam: { inond: 0, feu: 0, sol: 0, tech: 0 }, why: { inond: [], feu: [], sol: [], tech: [] } };
  const up = (k, v, why) => { r.fam[k] = Math.max(r.fam[k], v); r.why[k].push(why); };
  for (const p of hitsOf(c, IDX.ppr).concat(hitsOf(c, IDX.pprt))) {
    r.ppr.push(p);
    up(p._fam, p._fam === 'tech' ? 3 : 2, `Dans le périmètre réglementé du ${pprTitle(p)}`);
  }
  for (const z of hitsOf(c, IDX.local)) { r.local = (r.local || []).concat(z); up(z._fam, z._lv, `${z._title} : ${z._lab}`); }
  for (const z of hitsOf(c, IDX.vigi)) if ((z.hauteurmax || 0) > r.vigi) { r.vigi = z.hauteurmax || 0; r.vigiSt = z.lbstationhydro; }
  if (r.vigi) up('inond', r.vigi > 1000 ? 4 : r.vigi > 500 ? 3 : 2, `Jusqu'à ${fmt(r.vigi / 1000, 1)} m d'eau dans les crues cartographiées par Vigicrues (${r.vigiSt || 'station'})`);
  for (const a of hitsOf(c, IDX.arg)) r.arg = Math.max(r.arg, a);
  if (r.arg) up('sol', r.arg, `Exposition ${ARG[r.arg]} au retrait-gonflement des argiles`);
  for (const k of IDX.cav) { const d = distM(c, k.c); if (d <= R_FAR) r.cav.push(d); }
  for (const k of IDX.mvt) { const d = distM(c, k.c); if (d <= R_FAR) r.mvt.push(d); }
  if (r.cav.length) up('sol', Math.min(...r.cav) <= R_NEAR ? 3 : 2, `${plural(r.cav.length, 'cavité')} souterraine${r.cav.length > 1 ? 's' : ''} à moins de ${Math.min(...r.cav) <= R_NEAR ? R_NEAR : R_FAR} m`);
  if (r.mvt.length) up('sol', Math.min(...r.mvt) <= R_NEAR ? 3 : 2, `${plural(r.mvt.length, 'mouvement')} de terrain recensé${r.mvt.length > 1 ? 's' : ''} à moins de ${Math.min(...r.mvt) <= R_NEAR ? R_NEAR : R_FAR} m`);
  for (const f of IDX.foret) {
    if (!inBox(c, f.bb)) continue;
    const d = distToPolys(c, f.polys, R_FOREST[2]);
    if (d < r.forest) { r.forest = d; r.forestType = f.p; }
  }
  if (r.forest <= R_FOREST[2]) up('feu', r.forest <= R_FOREST[0] ? 3 : r.forest <= R_FOREST[1] ? 2 : 1, r.forest === 0 ? `En forêt (${(r.forestType || '').toLowerCase()})` : `À ${fmt(r.forest)} m d'un massif boisé`);
  if (hitsOf(c, IDX.old).length) { r.old = true; up('feu', Math.max(1, r.fam.feu), 'Zone de débroussaillement obligatoire'); }
  const vals = Object.values(r.fam);
  r.lv = Math.max(...vals);
  r.nfam = vals.filter((v) => v >= 2).length;
  return r;
}

/* ---------- Croisement complet ---------- */
function cross() {
  const D = S.data;
  buildIndex();
  S.B = (D.bati || []).map((f, i) => {
    const p = f.properties;
    const c = centroid(f.geometry);
    const resid = p.usage_1 === 'Résidentiel' || p.usage_2 === 'Résidentiel';
    const log = +p.nombre_de_logements || 0;
    const et = p.nombre_d_etages != null ? +p.nombre_d_etages : null;
    const h = +p.hauteur || null;
    const b = { i, id: p.cleabs, usage: p.usage_1 || 'Indifférencié', resid, log, pop: resid ? (log || 1) * HH : 0, h, et, an: (p.date_d_apparition || '').slice(0, 4), murs: p.materiaux_des_murs, alt: p.altitude_minimale_sol, c, geom: f.geometry };
    b.plainpied = et != null ? et <= 1 : h != null ? h < 4.5 : false;
    return Object.assign(b, c ? assess(c) : { lv: 0, nfam: 0, fam: { inond: 0, feu: 0, sol: 0, tech: 0 }, why: { inond: [], feu: [], sol: [], tech: [] }, ppr: [], cav: [], mvt: [], arg: 0, forest: Infinity });
  });
  S.E = (D.equip || []).map((f) => {
    const p = f.properties;
    const lbl = [p.nature, p.nature_detaillee, p.categorie].join(' ');
    const g = GROUPS.find((x) => x.re.test(lbl));
    if (!g) return null;
    const c = centroid(f.geometry);
    return c ? Object.assign({ nom: p.toponyme || p.nature_detaillee || p.nature, nature: p.nature_detaillee || p.nature, grp: g.id, c }, assess(c)) : null;
  }).filter(Boolean);
  // Routes : longueur en zone inondée ou en forêt
  const flood = IDX.vigi.concat(IDX.ppr.filter((x) => x.p._fam === 'inond'));
  const roads = { total: 0, flood: 0, foret: 0, list: [] };
  for (const f of D.routes || []) {
    for (const part of lineParts(f.geometry)) for (let i = 1; i < part.length; i++) {
      const a = part[i - 1], b = part[i];
      const len = distM(a, b);
      const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      roads.total += len;
      if (flood.some((z) => inBox(m, z.bb) && inPolys(m[0], m[1], z.polys))) { roads.flood += len; roads.list.push(f.properties.cpx_numero || f.properties.cpx_toponyme_route_nommee || ''); }
      if (IDX.foret.some((z) => inBox(m, z.bb) && inPolys(m[0], m[1], z.polys))) roads.foret += len;
    }
  }
  roads.named = [...new Set(roads.list.filter(Boolean))].slice(0, 6);
  S.roads = roads;
  // Études : documents dédoublonnés et nombre de bâtiments concernés
  const seen = new Map();
  for (const f of [...(D.ppr || []), ...(D.pprt || [])]) {
    const p = f.properties; const key = p.fichier || p.idgen;
    if (!seen.has(key)) seen.set(key, { ...p, _fam: pprFamily(p), n: 0, log: 0 });
  }
  for (const b of S.B) for (const p of b.ppr || []) { const s = seen.get(p.fichier || p.idgen); if (s) { s.n++; s.log += b.log; } }
  S.studies = [...seen.values()].sort((a, b) => b.n - a.n);
  S.commune = Array.isArray(D.commune) ? D.commune[0] : null;
  S.climat = D.climat || null;
  S.seisme = (D.seisme || []).reduce((m, f) => Math.max(m, +f.properties.max_int_calc || 0), 0) || null;
}

/* ---------- Lentilles et couleurs ---------- */
function levelFor(b, lens) {

}

function batiStyle(i) {

let map3d = null;

function fill3d() {
  if (!map3d || !map3d.getSource('bati3')) return;

  map3d.getSource('local3').setData({ type: 'FeatureCollection', features: (D.local || []).map((f) => ({ type: 'Feature', properties: { col: FAM[f.properties._fam].pal[Math.max(1, f.properties._lv)] }, geometry: stripZ(f.geometry) })) });
  map3d.getSource('ppr3').setData({ type: 'FeatureCollection', features: [...(D.ppr || []), ...(D.pprt || [])].map((f) => ({ type: 'Feature', properties: { col: FAM[pprFamily(f.properties)].col }, geometry: stripZ(f.geometry) })) });

/* ---------- Fiche bâtiment ---------- */
function lvTag(v, pal) { return `<span class="lv" style="background:${pal[v]};color:${v >= 3 ? '#fff' : '#18211f'}">${LV[v]}</span>`; }
function ficheHTML(b) {
  const fams = Object.entries(FAM).filter(([k]) => b.fam[k] > 0);
  const vuln = [];
  if (b.fam.inond >= 2 && b.plainpied) vuln.push('Bâtiment de plain-pied en zone inondable : pas d\'étage pour se mettre à l\'abri.');
  if (b.fam.inond >= 2 && b.resid && b.log > 10) vuln.push(`${b.log} logements à prévenir et, si besoin, à évacuer.`);
  if (b.fam.feu >= 2 && b.resid) vuln.push('Habitation en lisière : le débroussaillement à 50 m incombe au propriétaire.');
  if (b.fam.sol >= 2 && b.arg >= 2 && b.plainpied) vuln.push('Maison basse sur sol argileux : sensible aux fissures en période de sécheresse.');
  if (b.an && +b.an < 1980 && b.lv >= 2) vuln.push(`Présent depuis ${b.an} : antérieur à la plupart des règles de prévention.`);
  const acts = actionsFor(b);
  const cl = S.climat && S.climat.models.length ? climateLines(b) : [];
  const gr = `https://www.georisques.gouv.fr/mes-risques/connaitre-les-risques-pres-de-chez-moi/rapport2?typeForm=coordonnees&lon=${b.c[0].toFixed(5)}&lat=${b.c[1].toFixed(5)}`;
  const locs = [...new Set((b.local || []).map((z) => z._title))].map((t) => `<li>${esc(t)}</li>`).join('');
  const docs = (b.ppr || []).map((p) => { const u = pprDoc(p); return `<li>${u ? `<a href="${u}" target="_blank" rel="noopener">${esc(pprTitle(p))}</a>` : esc(pprTitle(p))}</li>`; }).join('');
  return `<div class="fiche"><h5><span class="dot" style="background:${MULTI_PAL[b.lv]}"></span>${esc(b.usage)}${lvTag(b.lv, MULTI_PAL)}</h5>
    <div class="sub">${b.resid ? `${b.log || 1} logement${b.log > 1 ? 's' : ''}, environ ${fmt(b.pop)} habitant${b.pop >= 2 ? 's' : ''}` : 'Sans logement'}${b.h ? ` · ${fmt(b.h, 1)} m` : ''}${b.et ? ` · ${b.et} niveau${b.et > 1 ? 'x' : ''}` : ''}${b.an ? ` · présent depuis ${b.an}` : ''}</div>
    <div class="scroll">
    <div class="sec"><b>Aléas qui le concernent</b>${fams.length ? '<ul>' + fams.map(([k, f]) => `<li><b>${f.lbl}</b>${lvTag(b.fam[k], f.pal)}<br>${b.why[k].map(esc).join('<br>')}</li>`).join('') + '</ul>' : '<span>Aucun aléa recensé par les sources croisées.</span>'}</div>
    ${vuln.length ? `<div class="sec"><b>Points de vulnérabilité</b><ul>${vuln.map((v) => `<li>${esc(v)}</li>`).join('')}</ul></div>` : ''}

function climateLines(b) {

/* ---------- Analyse ---------- */
function viewBbox() {
  let bb;
  if (S.dim === '3d' && map3d) {
    const c = map3d.getCenter(), z = map3d.getZoom() + 0.5;
    const half = (156543 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, z)) * 600; // demi-largeur approximative de la vue (m)
    bb = padBox([c.lng, c.lat, c.lng, c.lat], half);
  } else { const b = map.getBounds(); bb = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]; }
  const km2 = (bb[2] - bb[0]) * KX((bb[1] + bb[3]) / 2) / 1000 * (bb[3] - bb[1]) * 111.32;
  if (km2 > MAX_KM2) {
    const c = [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2], f = Math.sqrt(MAX_KM2 / km2);
    const hx = (bb[2] - bb[0]) * f / 2, hy = (bb[3] - bb[1]) * f / 2;
    bb = [c[0] - hx, c[1] - hy, c[0] + hx, c[1] + hy];
  }
  return bb;
}
async function analyse() {
  if (S.running) return;
  S.running = true;
  const bb = viewBbox();
  S.bb = bb; S.data = {}; S.errors = {}; S.focus = null; $('#focusbar').hidden = true;
  VL.zone.setBounds([[bb[1], bb[0]], [bb[3], bb[2]]]);
  $('#run').disabled = true; $('#busy').hidden = false;
  const keys = Object.keys(SOURCES);
  const prog = () => { $('#busyl').innerHTML = keys.map((k) => `<li>${S.data[k] !== undefined ? '✓' : S.errors[k] ? '✕' : '…'} ${esc(SOURCES[k].lbl)}</li>`).join(''); };
  prog();
  await Promise.all(keys.map(async (k) => {
    try { S.data[k] = await SOURCES[k].run(bb); } catch (e) { S.errors[k] = e.name === 'AbortError' ? 'délai dépassé' : e.message; }
    prog();
  }));
  cross(); draw();
  $('#busy').hidden = true; $('#run').disabled = false; S.running = false;
  const ok = keys.filter((k) => S.data[k] !== undefined).length;
  status(`${ok} sources sur ${keys.length} chargées · ${plural(S.B.length, 'bâtiment')} analysé${S.B.length > 1 ? 's' : ''}.` + (ok < keys.length ? ' Détail dans l\'onglet Études.' : ''));
  render();
}

/* ---------- Synthèse ---------- */
function summary() {
  const s = { n: S.B.length, pop: 0, log: 0, lv: [0, 0, 0, 0, 0], popLv: [0, 0, 0, 0, 0], fam: {}, multi: 0 };
  for (const k of Object.keys(FAM)) s.fam[k] = { lv: [0, 0, 0, 0, 0], pop: 0, log: 0 };
  for (const b of S.B) {
    s.pop += b.pop; s.log += b.log; s.lv[b.lv]++; s.popLv[b.lv] += b.pop;
    for (const k of Object.keys(FAM)) { const v = b.fam[k] || 0; s.fam[k].lv[v]++; if (v >= 2) { s.fam[k].pop += b.pop; s.fam[k].log += b.log; } }
    if (b.nfam >= 2) s.multi++;
  }
  s.exposed = s.lv[2] + s.lv[3] + s.lv[4];
  s.index = s.n ? Math.round((s.lv[1] * 0.5 + s.lv[2] * 1.5 + s.lv[3] * 3 + s.lv[4] * 4) / (4 * s.n) * 100) : 0;
  return s;
}

/* ---------- Plan d'action : les croisements traduits en priorités ---------- */
function actionsList() {
  const B = S.B, E = S.E, A = [];
  const add = (o) => { if (o.n > 0) A.push(o); };
  const sel = (fn) => B.filter(fn);
  const refuge = sel((b) => b.fam.inond >= 2 && b.plainpied && b.resid);
  add({ prio: 1, fam: 'inond', t: 'Logements sans étage refuge en zone inondable', n: refuge.reduce((s, b) => s + (b.log || 1), 0), unit: 'logements', ids: refuge,
    why: `${plural(refuge.length, 'bâtiment')} de plain-pied où les habitants ne peuvent pas se mettre à l'abri en hauteur.`,
    todo: ['Les recenser dans le plan communal de sauvegarde pour une évacuation prioritaire', 'Accompagner les travaux de zone refuge (fonds Barnier)'] });
  for (const g of GROUPS) {
    const ex = E.filter((e) => e.grp === g.id && e.lv >= 2);
    add({ prio: g.id === 'crise' ? 1 : 2, fam: 'multi', t: `${g.lbl} exposés`, n: ex.length, unit: ex.length > 1 ? 'sites' : 'site', ll: ex.map((e) => e.c),
      why: ex.slice(0, 4).map((e) => `${e.nom} (${Object.entries(FAM).filter(([k]) => e.fam[k] >= 2).map(([, f]) => f.lbl.toLowerCase()).join(', ')})`).join(' ; ') + (ex.length > 4 ? '…' : ''),
      todo: g.id === 'crise' ? ['Vérifier que la gestion de crise peut fonctionner si ce site est touché', 'Prévoir un site de repli'] : g.id === 'camping' ? ['Contrôler le cahier de prescriptions de sécurité du camping', 'Vérifier l\'alerte et l\'évacuation des occupants'] : ['Vérifier le plan particulier de mise en sûreté de l\'établissement', 'Prévoir l\'alerte et l\'accueil des publics fragiles'] });
  }
  const lisiere = sel((b) => b.fam.feu >= 2 && b.resid);
  add({ prio: 1, fam: 'feu', t: 'Habitations en lisière de forêt', n: lisiere.length, unit: 'bâtiments', ids: lisiere,
    why: `À moins de ${R_FOREST[1]} m d'un massif boisé, environ ${fmt(lisiere.reduce((s, b) => s + b.pop, 0))} habitants.`,
    todo: ['Contrôler le respect du débroussaillement sur 50 m', 'Vérifier l\'accès des secours et les points d\'eau (DECI)'] });
  const argBas = sel((b) => b.arg >= 2 && b.plainpied && b.resid);
  add({ prio: 2, fam: 'sol', t: 'Maisons sensibles aux argiles', n: argBas.length, unit: 'maisons', ids: argBas,
    why: 'Maisons basses sur sol d\'exposition moyenne ou forte : fissures possibles lors des sécheresses, qui vont se multiplier.',
    todo: ['Informer les propriétaires des bonnes pratiques (eaux pluviales, arbres)', 'Exiger l\'étude de sol pour les nouvelles constructions'] });
  const cav = sel((b) => b.cav.some((d) => d <= R_NEAR) || b.mvt.some((d) => d <= R_NEAR));
  add({ prio: 1, fam: 'sol', t: 'Bâtiments sur cavités ou mouvements connus', n: cav.length, unit: 'bâtiments', ids: cav,
    why: `Cavité ou mouvement de terrain recensé à moins de ${R_NEAR} m.`, todo: ['Faire diagnostiquer les cavités proches', 'Encadrer les permis de construire dans ce secteur'] });
  const multi = sel((b) => b.nfam >= 2);
  add({ prio: 2, fam: 'multi', t: 'Bâtiments exposés à plusieurs aléas', n: multi.length, unit: 'bâtiments', ids: multi,
    why: 'Plusieurs familles d\'aléas se cumulent : les mesures doivent être pensées ensemble.', todo: ['Prioriser ces bâtiments dans les diagnostics de vulnérabilité'] });
  const tech = sel((b) => b.fam.tech >= 3 && b.resid);
  add({ prio: 1, fam: 'tech', t: 'Logements dans un périmètre de risque industriel', n: tech.reduce((s, b) => s + (b.log || 1), 0), unit: 'logements', ids: tech,
    why: 'Dans le périmètre d\'un plan de prévention des risques technologiques.', todo: ['Suivre l\'avancement des travaux prescrits aux riverains', 'Vérifier la connaissance des consignes de confinement'] });
  if (S.roads && S.roads.flood > 50) A.push({ prio: 2, fam: 'inond', t: 'Routes en zone inondable', n: S.roads.flood / 1000, d: 1, unit: 'km', why: `Sur ${fmt(S.roads.total / 1000, 1)} km de routes${S.roads.named.length ? ', dont ' + S.roads.named.join(', ') : ''}. Risque d'isolement et d'accès difficile pour les secours.`, todo: ['Identifier des itinéraires d\'évacuation hors d\'eau', 'Prévoir la signalisation et la fermeture des voies'] });
  return A.sort((a, b) => a.prio - b.prio || b.n - a.n);
}

/* ---------- Messages clés ---------- */
function keyMessages(s) {
  const out = [];
  const famTop = Object.entries(FAM).map(([k, f]) => ({ k, f, n: s.fam[k].lv[2] + s.fam[k].lv[3] + s.fam[k].lv[4], pop: s.fam[k].pop })).sort((a, b) => b.n - a.n);
  if (famTop[0] && famTop[0].n) out.push([famTop[0].f.col, `<b>${famTop[0].f.lbl}</b> est l'aléa principal : ${plural(famTop[0].n, 'bâtiment')} et environ ${fmt(famTop[0].pop)} habitants concernés.`]);
  const sens = S.E.filter((e) => e.lv >= 2 && e.grp !== 'crise');
  if (sens.length) out.push(['#7e2231', `${plural(sens.length, 'établissement')} accueillant du public fragile ou nombreux ${sens.length > 1 ? 'sont exposés' : 'est exposé'}.`]);
  const crise = S.E.filter((e) => e.lv >= 2 && e.grp === 'crise');
  if (crise.length) out.push(['#7257ad', `${plural(crise.length, 'site')} de gestion de crise ${crise.length > 1 ? 'pourraient' : 'pourrait'} être touché${crise.length > 1 ? 's' : ''} ${crise.length > 1 ? 'eux-mêmes' : 'lui-même'}.`]);
  if (hasInd('nt')) {
    const n = S.climat.ind.nt, c = S.climat.ind.sec;
    out.push(['#e8a748', `D'ici 2040 : ${fmt(mean(n.ref))} → ${fmt(mean(n.fut))} nuits tropicales par an` + (hasInd('sec') ? ` et ${fmt(mean(c.ref))} → ${fmt(mean(c.fut))} jours de sol sec.` : '.')]);
  }
  if (!out.length) out.push(['#0f5b4f', 'Aucun aléa majeur recensé par les sources croisées sur cette emprise. Vérifiez les cartes officielles dans l\'onglet Couches.']);
  return out;
}

function famSource(k) {

function tabClimat() {
  if (!S.bb) return NEED;
  const C = S.climat;
  if (!C || !C.models.length) return `<h2>Climat futur</h2><p class="muted">${S.errors.climat ? 'Projections indisponibles : ' + esc(S.errors.climat) + '. Le service gratuit limite le nombre de calculs par heure.' : 'Projections non chargées.'}</p><div class="btn-row" style="margin-top:10px"><button class="btn" id="clim-retry">Réessayer</button></div>`;
  const I = (id) => C.ind[id];
  const s = summary();
  const line = (ind) => {
    const x = I(ind.id), r = mean(x.ref), f = mean(x.fut);
    const d = f - r, rel = r > 0.5 ? Math.round((d / r) * 100) : null;
    return `<div class="clim"><div><b>${ind.lbl}</b></div><div class="v">${fmt(r, ind.d)} → <b>${fmt(f, ind.d)}</b> ${ind.unit}${Math.abs(d) >= 0.5 ? `<span class="delta">${d > 0 ? '+' : ''}${rel != null ? rel + ' %' : fmt(d, 1)}</span>` : ''}</div>
      <small>${esc(ind.desc)}.</small></div>`;
  };
  const heat = S.E.filter((e) => e.grp === 'sante' || e.grp === 'enseignement');
  const argB = S.B.filter((b) => b.arg >= 2).length;
  const floodB = S.B.filter((b) => b.fam.inond >= 2).length;
  const fireB = S.B.filter((b) => b.fam.feu >= 1).length;
  const [n0, n1] = [mean(I('nt').ref), mean(I('nt').fut)], [s0, s1] = [mean(I('sec').ref), mean(I('sec').fut)], [r0, r1] = [mean(I('rr20').ref), mean(I('rr20').fut)], [f0, f1] = [mean(I('feu').ref), mean(I('feu').fut)];
  return `<h2>Climat 2040 : ce qui va changer ici</h2>
    <p class="lead">Moyenne 2001-2020 comparée à 2031-2050 au centre de l'emprise, d'après le modèle climatique à haute résolution EC-Earth3P-HR (CMIP6 HighResMIP, émissions élevées).</p>
    <h3>Climat et enjeux du secteur</h3>
    ${hasInd('nt') ? `<div class="cross"><b>Chaleur : ${fmt(n0)} → ${fmt(n1)} nuits tropicales par an</b><span class="muted">Concerne les ${fmt(s.pop)} habitants estimés, en priorité ${plural(heat.length, 'établissement')} de santé ou d'enseignement. Pistes : îlots de fraîcheur, végétalisation, plan canicule.</span></div>` : ''}
    ${hasInd('sec') ? `<div class="cross"><b>Sécheresse des sols : ${fmt(s0)} → ${fmt(s1)} jours par an</b><span class="muted">${plural(argB, 'bâtiment')} sur argiles d'exposition moyenne ou forte, où les fissures vont se multiplier.</span></div>` : ''}
    ${hasInd('rr20') ? `<div class="cross"><b>Pluies intenses : ${fmt(r0, 1)} → ${fmt(r1, 1)} jours de 20 mm ou plus par an</b><span class="muted">${plural(floodB, 'bâtiment')} déjà en zone inondable. Le ruissellement urbain peut aussi toucher des secteurs hors zonage.</span></div>` : ''}
    ${hasInd('feu') ? `<div class="cross"><b>Météo propice aux feux : ${fmt(f0, 1)} → ${fmt(f1, 1)} jours par an</b><span class="muted">${plural(fireB, 'bâtiment')} à moins de ${R_FOREST[2]} m d'un massif boisé.</span></div>` : ''}
    <h3>Indicateurs</h3>
    ${CL_IND.filter((i) => hasInd(i.id)).map(line).join('')}
    <div class="note">Ordres de grandeur issus d'un modèle global à 25 km de résolution, sans correction locale. Les projections de référence en France sont celles de DRIAS (Météo-France), utilisées par la trajectoire de réchauffement de référence (TRACC) : <a href="https://www.drias-climat.fr/" target="_blank" rel="noopener">drias-climat.fr</a>.</div>`;
}

  return `<div class="tblwrap"><table><tr><th>Zonage</th><th class="n">Zones</th><th class="n">Bât.</th></tr>${[...by.values()].map((e) => `<tr><td><span class="dot" style="background:${FAM[e.fam].col}"></span>${esc(e.title)}</td><td class="n">${fmt(e.n)}</td><td class="n">${fmt(e.b)}</td></tr>`).join('')}</table></div>`;

function setFocus(list, lbl) {
  S.focus = new Set(list.map((b) => b.i));
  $('#focust').textContent = lbl; $('#focusbar').hidden = false;
  restyle();
  const pts = list.map((b) => b.c).filter(Boolean);
  if (pts.length) {
    if (S.dim === '3d' && map3d) { const lo = pts.map((p) => p[0]), la = pts.map((p) => p[1]); map3d.fitBounds([[Math.min(...lo), Math.min(...la)], [Math.max(...lo), Math.max(...la)]], { padding: 60, maxZoom: 17 }); }
    else map.fitBounds(L.latLngBounds(pts.map((c) => [c[1], c[0]])).pad(0.25), { maxZoom: 17 });
  }
}
$('#focusx').addEventListener('click', () => { S.focus = null; $('#focusbar').hidden = true; restyle(); });

function bind() {
  document.querySelectorAll('[data-b]').forEach((tr) => tr.addEventListener('click', () => {
    const b = S.B[+tr.dataset.b];
    if (S.dim === '3d' && map3d) map3d.flyTo({ center: b.c, zoom: 17.5 }); else map.setView([b.c[1], b.c[0]], 18);
    openFiche(b, S.dim === '3d' ? { lng: b.c[0], lat: b.c[1] } : L.latLng(b.c[1], b.c[0]));
  }));
  document.querySelectorAll('[data-ll]').forEach((tr) => tr.addEventListener('click', () => { const [la, lo] = tr.dataset.ll.split(',').map(Number); if (S.dim === '3d' && map3d) map3d.flyTo({ center: [lo, la], zoom: 17.5 }); else map.setView([la, lo], 18); }));
  document.querySelectorAll('[data-act]').forEach((bt) => bt.addEventListener('click', () => {
    const a = S._actions[+bt.dataset.act];
    if (a.ids) setFocus(a.ids, a.t);
    else if (a.ll && a.ll.length) { if (S.dim === '3d') setDim('2d'); map.fitBounds(L.latLngBounds(a.ll.map((c) => [c[1], c[0]])).pad(0.4), { maxZoom: 17 }); }
  }));
  VEC.forEach((v) => { const el = document.getElementById('v-' + v.id); if (el) el.addEventListener('change', () => { if (el.checked) { VL[v.id].addTo(map); reorder(); } else map.removeLayer(VL[v.id]); }); });
  WMS.forEach((w) => { const el = document.getElementById('w-' + w.id); if (el) el.addEventListener('change', () => { if (el.checked) { wmsL[w.id].addTo(map); if (S.dim === '3d') setDim('2d'); } else map.removeLayer(wmsL[w.id]); }); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('exp-csv', exportCSV); on('exp-geo', exportGeo); on('exp-rep', exportReport);
  on('clim-retry', async () => { try { S.climat = S.data.climat = await fetchClimate((S.bb[0] + S.bb[2]) / 2, (S.bb[1] + S.bb[3]) / 2); delete S.errors.climat; } catch (e) { S.errors.climat = e.message; } render(); });
}

/* ---------- Exports ---------- */
function save(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
const slug = () => (S.commune ? S.commune.nom : 'secteur').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-');
const rowOf = (b) => ({
  cleabs: b.id, usage: b.usage, logements: b.log, habitants_estimes: +b.pop.toFixed(1), niveaux: b.et ?? '', hauteur_m: b.h != null ? +b.h.toFixed(1) : '', plain_pied: b.plainpied ? 'oui' : '',
  niveau_multirisque: b.lv, libelle: LV[b.lv], nb_aleas: b.nfam, inondation: b.fam.inond, feu: b.fam.feu, sols: b.fam.sol, industriel: b.fam.tech,
  hauteur_eau_vigicrues_m: b.vigi ? b.vigi / 1000 : '', argiles: b.arg ? ARG[b.arg] : '', distance_foret_m: isFinite(b.forest) ? Math.round(b.forest) : '',
  cavites_150m: (b.cav || []).length, mouvements_150m: (b.mvt || []).length, plans_prevention: (b.ppr || []).map(pprTitle).join(' | '),
  actions: actionsFor(b).join(' | '), lon: b.c ? +b.c[0].toFixed(6) : '', lat: b.c ? +b.c[1].toFixed(6) : '',
});
function exportCSV() {
  const rows = S.B.map(rowOf); if (!rows.length) return;
  const head = Object.keys(rows[0]);
  save(`resiterre_${slug()}.csv`, '﻿' + [head.join(';'), ...rows.map((r) => head.map((h) => `"${String(r[h]).replace(/"/g, '""')}"`).join(';'))].join('\n'), 'text/csv');
}
function exportGeo() { save(`resiterre_${slug()}.geojson`, JSON.stringify({ type: 'FeatureCollection', name: 'RésiTerre par Mahel Chéour', features: S.B.map((b) => ({ type: 'Feature', geometry: stripZ(b.geom), properties: rowOf(b) })) }), 'application/geo+json'); }
function exportReport() {
  const s = summary(), c = S.commune, A = actionsList(), C = S.climat;
  const lines = [`RÉSITERRE · DIAGNOSTIC DE VULNÉRABILITÉ`, `Outil conçu et développé par Mahel Chéour (mahelchr@gmail.com)`, `${c ? `${c.nom} (${c.code})` : 'Secteur'} · ${new Date().toLocaleDateString('fr-FR')}`, '',
    'CE QU\'IL FAUT RETENIR', ...keyMessages(s).map(([, t]) => '- ' + t.replace(/<[^>]+>/g, '')), '',
    `Bâtiments analysés : ${s.n} · exposés (modéré ou plus) : ${s.exposed} · fort ou très fort : ${s.lv[3] + s.lv[4]} · plusieurs aléas : ${s.multi}`, `Indice de vulnérabilité du secteur : ${s.index} / 100`, '',
    'PAR ALÉA', ...Object.entries(FAM).map(([k, f]) => `- ${f.lbl} : ${s.fam[k].lv[2] + s.fam[k].lv[3] + s.fam[k].lv[4]} bâtiments, ${fmt(s.fam[k].pop)} habitants`), '',
    'PRIORITÉS D\'ACTION', ...A.map((a) => `- [${a.prio === 1 ? 'Prioritaire' : 'À planifier'}] ${a.t} : ${fmt(a.n, a.d)} ${a.unit}\n    ${a.todo.join(' ; ')}`), '',
    C && C.models.length ? 'CLIMAT 2031-2050 (par rapport à 2001-2020)' : '', ...(C && C.models.length ? CL_IND.filter((i) => hasInd(i.id)).map((i) => `- ${i.lbl} : ${fmt(mean(C.ind[i.id].ref), i.d)} → ${fmt(mean(C.ind[i.id].fut), i.d)} ${i.unit}`) : []), '',
    'DOCUMENTS DE PRÉVENTION', ...S.studies.map((p) => `- ${pprTitle(p)}${pprDate(p) ? ' (' + pprDate(p) + ')' : ''} : ${pprDoc(p) || 'non publié'}`), '',
    'Sources : IGN (BD TOPO, débroussaillement, Vigicrues), Géoportail de l\'urbanisme, BRGM, INSEE, CMIP6 via Open-Meteo.'];
  save(`resiterre_${slug()}.txt`, lines.join('\n'), 'text/plain');
}

/* ---------- Recherche ---------- */
let st;
$('#q').addEventListener('input', () => {
  clearTimeout(st);
  const q = $('#q').value.trim();
  if (q.length < 3) { $('#suggest').hidden = true; return; }
  st = setTimeout(async () => {
    try {
      const res = (await getJSON(`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(q)}&limit=6`)).features || [];
      $('#suggest').innerHTML = res.map((f, i) => `<li data-i="${i}">${esc(f.properties.label)}<small>${f.properties.type === 'municipality' ? 'commune' : 'adresse'}</small></li>`).join('');
      $('#suggest').hidden = !res.length;
      $('#suggest').querySelectorAll('li').forEach((li) => li.addEventListener('click', () => {
        const f = res[+li.dataset.i], [lo, la] = f.geometry.coordinates, z = f.properties.type === 'municipality' ? 15 : 17;
        $('#suggest').hidden = true; $('#q').value = f.properties.label;
        map.setView([la, lo], z); if (map3d) map3d.jumpTo({ center: [lo, la], zoom: z - 0.5 });
        status('Vue déplacée. Cliquez sur Analyser la vue.');
      }));
    } catch (e) { status('Recherche indisponible : ' + e.message); }
  }, 250);
});
document.addEventListener('click', (e) => { if (!e.target.closest('.searchrow')) $('#suggest').hidden = true; });
$('#run').addEventListener('click', analyse);
$('#about-link').addEventListener('click', (e) => { e.preventDefault(); document.querySelector('.tabs button[data-tab="methode"]').click(); setTimeout(() => document.getElementById('about')?.scrollIntoView({ behavior: 'smooth' }), 50); });

legend(); render();
status('Exemple : La Teste-de-Buch (Gironde). Déplacez la carte et relancez l\'analyse.');
map.whenReady(() => setTimeout(analyse, 300));
</script>
</body>
