<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RésiTerre</title>
<meta name="author" content="Mahel Chéour">
<meta name="description" content="RésiTerre, outil d'information sur les risques majeurs conçu et développé par Mahel Chéour. Croise, bâtiment par bâtiment, les données publiques officielles sur les aléas et la réglementation.">
<meta property="og:title" content="RésiTerre, par Mahel Chéour">
<meta property="og:description" content="Croiser les données officielles sur les risques majeurs, bâtiment par bâtiment, sans rien extrapoler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root {
  --bg: #f5f6f3; --panel: #ffffff; --ink: #18211f; --ink-2: #435049; --ink-3: #66726b;
  --line: #dde2de; --line-2: #eef1ee; --accent: #0f5b4f; --accent-soft: #e1eeea; --on-accent: #ffffff;
  --warn-bg: #fbf0dc; --warn-ink: #6d4810; --info-bg: #e7eef8; --info-ink: #21456f;
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111715; --panel: #18201d; --ink: #e8eeea; --ink-2: #b9c4be; --ink-3: #8f9b94;
    --line: #2b3632; --line-2: #222b28; --accent: #5cc0a8; --accent-soft: #1d3530; --on-accent: #0d1a17;
    --warn-bg: #3a2e18; --warn-ink: #f2d29a; --info-bg: #1c2a3b; --info-ink: #b9d3f2; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
#app { display: grid; grid-template-columns: 480px 1fr; height: 100%; }
#side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
#mapwrap { position: relative; min-width: 0; }
#map, #map3d { position: absolute; inset: 0; background: var(--line-2); }

header.top { padding: 14px 18px 10px; display: flex; flex-direction: column; gap: 9px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--ink-3); font-size: 12.5px; flex: 1; min-width: 0; }
.learnbtn { margin-left: auto; border-color: var(--accent); color: var(--accent); font-weight: 600; }
#learn { position: fixed; inset: 0; z-index: 2000; background: var(--bg); display: flex; flex-direction: column; }
#learn > header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#learn > header > b { font-size: 17px; }
#learnnav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
#learnnav button { border: 0; background: none; padding: 7px 11px; border-radius: 8px; cursor: pointer; color: var(--ink-3); }
#learnnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#learnbody { flex: 1; overflow-y: auto; padding: 22px max(18px, calc(50% - 380px)) 60px; }
#learnbody h2 { font-size: 22px; }
.uses { display: grid; gap: 8px; margin: 8px 0 12px; }
.uses > div { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 11px; }
.uses b { display: block; } .uses span { font-size: 12.5px; color: var(--ink-2); }
.kpi.alert { border-color: #e7b48a; background: var(--warn-bg); }
.kpi.alert b, .kpi.alert span { color: var(--warn-ink); }
.pill.st-eau { background: #dbe8f6; color: #1f4f8a; } .pill.st-rue { background: #fbe6d2; color: #8a4a12; } .pill.st-isole { background: #f6d9d6; color: #8c241d; }
.live { font-size: 12.5px; background: var(--info-bg); color: var(--info-ink); border-radius: 8px; padding: 7px 10px; margin: 4px 0; }
.live .btn.sm { margin-left: 4px; }
ul.cols2 { columns: 2; column-gap: 16px; } ul.cols2 li { break-inside: avoid; }
tr.sel td { background: var(--accent-soft); font-weight: 600; }
.chips.seg { display: inline-flex; box-shadow: none; }
.prose h4 { font-size: 13px; }
.brand a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); }
.searchrow { display: flex; gap: 8px; position: relative; }
.searchrow input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.searchrow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#suggest { position: absolute; top: 42px; left: 0; right: 0; z-index: 1000; list-style: none; margin: 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 22px rgba(0,0,0,.12); }
#suggest li { padding: 7px 9px; border-radius: 6px; cursor: pointer; }
#suggest li:hover, #suggest li.on { background: var(--accent-soft); }
#suggest small { color: var(--ink-3); margin-left: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.stop { background: var(--warn-bg); border-color: var(--warn-bg); color: var(--warn-ink); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:focus-visible, .tabs button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { font-size: 12.5px; color: var(--ink-3); min-height: 18px; }
.progress { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.credit { font-size: 11.5px; color: var(--ink-3); padding: 8px 18px; border-top: 1px solid var(--line); }
.credit b { color: var(--ink-2); font-weight: 600; }
.mail { user-select: all; }

.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; background: none; padding: 10px 9px; cursor: pointer; color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
#content { flex: 1; overflow-y: auto; padding: 16px 18px 28px; min-height: 0; }
.prose h2 { font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
.prose h3 { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 22px 0 8px; font-weight: 600; }
.prose h4 { font-size: 13.5px; margin: 14px 0 4px; }
.prose p { margin: 0 0 10px; }
.prose ul { margin: 0 0 10px; padding-left: 18px; }
.prose li { margin: 2px 0; }
.lead { color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--line-2); border-radius: 8px; padding: 9px 11px; margin: 10px 0; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); }
.note.info { background: var(--info-bg); color: var(--info-ink); }
.note a { color: inherit; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.kpi { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.kpi b { display: block; font-family: var(--mono); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi span { font-size: 11.5px; color: var(--ink-3); }

.tblwrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); border-bottom: 1px solid var(--line); padding: 6px 4px; vertical-align: bottom; }
td { border-bottom: 1px solid var(--line-2); padding: 6px 4px; vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--accent-soft); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; flex: none; vertical-align: -1px; border: 1px solid rgba(0,0,0,.15); }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--line-2); color: var(--ink-2); margin: 2px 4px 0 0; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.ko { background: var(--warn-bg); color: var(--warn-ink); }

.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 12.5px; }
.src .meta { color: var(--ink-3); font-size: 12px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.links a { font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink-2); }
.links a:hover { border-color: var(--accent); color: var(--accent); }
details { border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; margin-bottom: 8px; }
details[open] { padding-bottom: 8px; }
summary { cursor: pointer; padding: 10px 0; font-weight: 600; list-style-position: inside; }
summary small { font-weight: 400; color: var(--ink-3); margin-left: 6px; }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 4px 0 10px; font-size: 12.5px; }
dl.kv dt { color: var(--ink-3); }
dl.kv dd { margin: 0; }
.term { padding: 7px 0; border-bottom: 1px solid var(--line-2); }
.term b { display: block; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; }
.steps li { counter-increment: s; position: relative; padding-left: 28px; margin: 8px 0 !important; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; }

.maptools { position: absolute; top: 12px; right: 12px; left: 12px; z-index: 700; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
.maptools > * { pointer-events: auto; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.seg button { border: 0; background: none; padding: 6px 10px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--ink); color: var(--panel); }
.seg button:disabled { color: var(--ink-3); cursor: wait; }
.lens { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); font-size: 12px; max-width: 100%; }
.lens select { border: 0; background: var(--line-2); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; font-weight: 600; max-width: 260px; }
.mapopts { position: absolute; top: 56px; right: 12px; z-index: 720; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.14); display: grid; gap: 8px; min-width: 260px; }
.optrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--ink-3); }
.optrow .seg { box-shadow: none; }
#twin { display: grid; gap: 8px; } #twin[hidden] { display: none; }
.brand h1 a { color: inherit; text-decoration: none; }
.toolbar { display: flex; gap: 6px; padding: 8px 18px 0; }
.toolbar button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.toolbar button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.toolcards { display: grid; gap: 10px; margin: 12px 0 16px; }
.toolcard { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel); cursor: pointer; font: inherit; color: var(--ink); display: grid; gap: 4px; }
.toolcard:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.toolcard b { font-size: 15px; } .toolcard span { font-size: 13px; color: var(--ink-2); } .toolcard small { font-size: 12px; color: var(--accent); }
.toolcard .ask { display: block; font-size: 12.5px; color: var(--ink-3); font-style: italic; }
.right { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.legend { position: absolute; left: 12px; bottom: 22px; z-index: 650; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); max-width: 290px; max-height: calc(100% - 90px); overflow-y: auto; }
.legend h4 { margin: 0 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.legend h4 + p { margin: -2px 0 6px; color: var(--ink-3); font-size: 11.5px; }
.legend .row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
.legend i { width: 15px; height: 11px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
.legend i.line { height: 0; border: 0; border-top: 2px dashed; border-radius: 0; }
.legend i.pt { width: 11px; height: 11px; border-radius: 50%; }
.legend .sep { border-top: 1px solid var(--line); margin: 7px 0 6px; }
.legend img { display: block; max-width: 100%; margin: 3px 0 6px; background: #fff; border-radius: 4px; }
.legend button.min { float: right; border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 11px; padding: 0 0 0 8px; }
.legend.small > :not(h4):not(button) { display: none; }
.focusbar { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); z-index: 700; background: var(--ink); color: var(--panel); border-radius: 18px; padding: 6px 8px 6px 14px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.2); max-width: calc(100% - 24px); }
.focusbar button { border: 0; background: var(--panel); color: var(--ink); border-radius: 12px; padding: 3px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .progress i { transition: none; } }
.srclist { list-style: none; padding: 0 !important; margin: 6px 0 !important; font-size: 12px; columns: 2; column-gap: 14px; }
.srclist li { break-inside: avoid; color: var(--ink-3); }
.srclist li.ok { color: var(--ink-2); }
.srclist li.ko { color: var(--warn-ink); }
.srclist .state { display: inline-block; min-width: 74px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
.legend details.howto { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 0; margin: 7px 0 0; }
.legend details.howto summary { padding: 6px 0 2px; font-size: 11.5px; color: var(--accent); }
.legend details.howto p { margin: 4px 0; font-size: 11.5px; line-height: 1.45; color: var(--ink-2); }
details.srcsheet summary { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; list-style: none; }
details.srcsheet summary::-webkit-details-marker { display: none; }
details.srcsheet summary > span:first-child { min-width: 0; }
details.srcsheet .meta { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
details.srcsheet .st { font-weight: 400; font-size: 11.5px; color: var(--ink-3); text-align: right; flex: none; max-width: 40%; }
details.srcsheet .st.ko { color: var(--warn-ink); }
details.srcsheet code { font-size: 11.5px; }
details.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.links .btn.sm { font-size: 12.5px; padding: 3px 9px; border-radius: 12px; }
ul.cross li { margin: 6px 0; }
.trio { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
.trio > div:not(.x) { flex: 1 1 90px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: center; }
.trio b { display: block; font-size: 15px; } .trio span { font-size: 11.5px; color: var(--ink-3); } .trio .x { font-size: 18px; color: var(--ink-3); }
.here { background: var(--accent-soft); border-radius: 8px; padding: 8px 11px; margin: 4px 0 10px; font-size: 13px; }
.here b { color: var(--accent); } .here ul { margin: 4px 0 0; padding-left: 18px; }
ol.reflex { padding-left: 20px; } ol.reflex li { margin: 4px 0; }
.lab { display: grid; gap: 10px; }
.tool { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tool h4 { margin: 0 0 4px; font-size: 14px; }
.chips { display: inline-flex; flex-wrap: wrap; margin: 6px 0; }
.chips button { padding: 6px 10px; font-size: 12.5px; min-height: 32px; }
.rng { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
.rng input { flex: 1; accent-color: var(--accent); min-height: 28px; }
.big { font-size: 13px; margin: 6px 0; } .big span { display: block; font-family: var(--mono); font-size: 30px; color: var(--accent); line-height: 1.1; }
.wat { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px; align-items: center; }
.wat svg { width: 120px; height: 110px; } .wat p { margin: 4px 0 0; font-size: 13px; min-height: 54px; }
.q { padding: 6px 0; display: none; } .q.cur { display: block; } .q p { margin: 0 0 6px; font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; min-height: 32px; }
.opts button:hover { border-color: var(--accent); }
.opts button.good { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opts button.bad { background: var(--warn-bg); border-color: var(--warn-ink); color: var(--warn-ink); }
.opts button.dim { opacity: .45; }
.q .fb { font-size: 12.5px; color: var(--ink-3); margin: 4px 0 0; min-height: 1em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 10px; }
.card { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; min-height: 48px; }
.card b { display: block; font-size: 13.5px; } .card span { display: none; font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
.card.open { grid-column: 1 / -1; border-color: var(--accent); background: var(--accent-soft); } .card.open span { display: block; }
@media (max-width: 420px) { .wat { grid-template-columns: 1fr; } }
.fiche a.learn { font-size: 11px; color: #0f5b4f; white-space: nowrap; }
.fiche a.srcref { color: inherit; text-decoration: underline dotted; }

.leaflet-popup-content, .maplibregl-popup-content { font-family: var(--sans); font-size: 12.5px; line-height: 1.45; }
.leaflet-popup-content { margin: 10px 12px; width: 320px !important; }
.maplibregl-popup-content { padding: 10px 12px; width: 344px; color: #18211f; }
.fiche h5 { margin: 0 0 2px; font-size: 14px; }
.fiche .sub { color: #5d6963; margin-bottom: 6px; }
.fiche .sec { margin-top: 9px; }
.fiche .sec .sh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fiche .sec .sh b, .fiche .sec > b { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: #5d6963; margin-bottom: 3px; }
.fiche ul { margin: 0; padding-left: 16px; }
.fiche li { margin: 3px 0; }
.fiche li.no { color: #6d7a73; }
.fiche li small { color: #5d6963; }
.fiche dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
.fiche dt { color: #5d6963; }

function gmlPairs(txt) {
  const n = txt.trim().split(/\s+/).map(Number), out = [];
  for (let i = 0; i + 1 < n.length; i += 2) out.push([n[i + 1], n[i]]);
  return out;
}
function gmlRing(el) {
  if (!el) return [];
  const pl = el.getElementsByTagNameNS('*', 'posList')[0];
  if (pl) return gmlPairs(pl.textContent);
  return [...el.getElementsByTagNameNS('*', 'pos')].map((p) => gmlPairs(p.textContent)[0]).filter(Boolean);
}
function gmlGeom(g) {
  if (!g) return null;
  const all = (name) => (g.localName === name ? [g] : []).concat([...g.getElementsByTagNameNS('*', name)]);
  const polys = all('Polygon').concat(all('PolygonPatch'));
  if (polys.length) {
    const co = polys.map((p) => [gmlRing(p.getElementsByTagNameNS('*', 'exterior')[0])].concat([...p.getElementsByTagNameNS('*', 'interior')].map(gmlRing))).filter((p) => p[0].length > 2);
    return co.length ? { type: 'MultiPolygon', coordinates: co } : null;
  }
  const lines = all('LineString');
  if (lines.length) return { type: 'MultiLineString', coordinates: lines.map(gmlRing).filter((l) => l.length > 1) };
  const pts = all('Point');
  if (pts.length) { const c = gmlRing(pts[0])[0]; return c ? { type: 'Point', coordinates: c } : null; }
  return null;
}
function parseGML(txt) {
  const x = new DOMParser().parseFromString(txt, 'text/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('réponse illisible');
  const exc = x.getElementsByTagNameNS('*', 'ExceptionText')[0];
  if (exc) throw new Error(exc.textContent.slice(0, 120));
  const feats = [];
  for (const m of x.getElementsByTagNameNS('*', 'member')) {
    const f = m.firstElementChild; if (!f) continue;
    const props = {}; let geom = null;
    for (const c of f.children) {
      if (c.localName === 'boundedBy') continue;
      if (c.children.length) geom = geom || gmlGeom(c.firstElementChild);
      else props[c.localName] = c.textContent;
    }
    if (geom) feats.push({ type: 'Feature', properties: props, geometry: geom });
  }
  return { feats, returned: +(x.documentElement.getAttribute('numberReturned') || 0) };
}

/* ---------- Services ---------- */
const GEOPF = (type, bb, extra = '') => 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature'
  + `&TYPENAMES=${type}&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&BBOX=${bb.join(',')},EPSG:4326` + extra;
const BRGM = (type, bb, n = 2000) => 'https://geoservices.brgm.fr/risques?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature'
  + `&TYPENAMES=ms:${type}&COUNT=${n}&BBOX=${bb[1]},${bb[0]},${bb[3]},${bb[2]},urn:ogc:def:crs:EPSG::4326`
  + '&OUTPUTFORMAT=' + encodeURIComponent('application/json; subtype=geojson; charset=utf-8');
const GR_WFS = 'https://www.georisques.gouv.fr/services?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature';
const GR_API = 'https://georisques.gouv.fr/api/v1/';
const boxPoly = (bb) => ({ type: 'Polygon', coordinates: [[[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]], [bb[0], bb[1]]]] });
const GPU = (cat, bb) => `https://apicarto.ign.fr/api/gpu/assiette-sup-s?categorie=${cat}&geom=` + encodeURIComponent(JSON.stringify(boxPoly(bb)));

async function geopfPaged(type, bb, sig, max, props) {
  const out = [];
  for (let s = 0; s < max; s += 5000) {
    const j = await getJSON(GEOPF(type, bb, `&COUNT=5000&STARTINDEX=${s}` + (props ? '&PROPERTYNAME=' + props : '')), sig, 90000);
    const f = (j && j.features) || [];
    out.push(...f);
    if (f.length < 5000) break;
  }
  return out;
}
async function grWFS(type, bb, sig, max = 6000) {
  const out = [];
  for (let s = 0; s < max; s += 2000) {
    const url = `${GR_WFS}&TYPENAMES=ms:${type}&COUNT=2000&STARTINDEX=${s}&BBOX=${bb[1]},${bb[0]},${bb[3]},${bb[2]},urn:ogc:def:crs:EPSG::4326`;
    const { feats, returned } = parseGML(await fetchText(url, sig, 90000));
    out.push(...feats);
    if (returned < 2000) break;
  }
  return out;
}
async function grPaged(path, sig, maxPages = 20) {
  const out = [];
  for (let p = 1; p <= maxPages; p++) {
    const j = await getJSON(`${GR_API}${path}${path.includes('?') ? '&' : '?'}page=${p}&page_size=100`, sig, 45000, true);
    if (!j) break;
    out.push(...(j.data || []));
    if (!j.total_pages || p >= j.total_pages) break;
  }
  return out;
}

/* ---------- Zonages publiés localement sur la Géoplateforme ----------
   Les services de l'État y publient des zonages précis (zones des PPR au
   standard CNIG, aléas locaux). La liste évolue : on la lit dans le
   catalogue du service à chaque session et on retient les couches liées aux
   risques dont l'emprise recoupe la zone analysée. */
let CAPS = null;
const RISK_RE = /zone_reg|ppr[nimtlsf]|ppri|pprt|al[ée]a|inond|submer|crue|ruissel|risque|mouvement|cavit|argil|feu de for|incendie/i;
async function geopfCatalog(sig) {
  if (CAPS) return CAPS;
  const t = await fetchText('https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities', sig, 45000);
  const dec = (s) => (s || '').replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/&quot;/g, '"');
  CAPS = [...t.matchAll(/<FeatureType[\s\S]*?<\/FeatureType>/g)].map((m) => {
    const x = m[0];
    const lc = (x.match(/<ows:LowerCorner>([^<]+)<\/ows:LowerCorner>/) || [])[1], uc = (x.match(/<ows:UpperCorner>([^<]+)<\/ows:UpperCorner>/) || [])[1];
    const a = lc ? lc.split(' ').map(Number) : null, b = uc ? uc.split(' ').map(Number) : null;
    return { name: (x.match(/<Name>([^<]+)/) || [])[1], title: dec((x.match(/<Title>([^<]+)/) || [])[1]), bb: a && b ? [a[0], a[1], b[0], b[1]] : null };
  }).filter((f) => f.name && RISK_RE.test(f.name + ' ' + f.title) && !/patrinat|vigicrues|viginond|debroussaillement|carro_dfci|conservatoire|bdtopo/i.test(f.name));
  return CAPS;
}
const pick = (p, keys) => { for (const k of keys) { const v = p[k] ?? p[k.toUpperCase()]; if (v != null && v !== '') return String(v); } return ''; };
async function fetchLocalZones({ bb, sig }) {
  const cat = await geopfCatalog(sig);
  const hit = cat.filter((f) => f.bb && f.bb[0] <= bb[2] && f.bb[2] >= bb[0] && f.bb[1] <= bb[3] && f.bb[3] >= bb[1]).slice(0, 15);
  const out = [];
  await pool(hit, 4, async (l) => {
    try {
      const j = await getJSON(GEOPF(l.name, bb, '&COUNT=3000'), sig, 40000);
      for (const f of (j && j.features) || []) {
        if (!f.geometry || !/Polygon/.test(f.geometry.type)) continue;
        const p = f.properties || {};
        f.properties = { ...p, _title: l.title, _layer: l.name, _code: pick(p, ['codezone', 'code_zone', 'zone', 'typezone']), _typereg: pick(p, ['typereg', 'type_reg']).padStart(2, '0').replace(/^00$/, ''), _lib: pick(p, ['libelle', 'lib_zone', 'nomzone', 'nom', 'libzone']) };
        out.push(f);
      }
    } catch (e) { if (sig.aborted) throw e; /* couche sans réponse : les autres sont gardées */ }
  });
  return out;
}

/* ---------- Jeux de données publiés sur data.gouv.fr pour la commune ---------- */
const STUDY_RE = /risque|pprn|ppri|pprt|pprif|pprl|pprmt|inond|submersion|crue|al[ée]a|zone r[ée]glement|atlas des zones|territoire.{0,4}risque|mouvement de terrain|cavit|argile|feu de for|incendie|dicrim|catastrophe|ruissellement|s[ée]isme|littoral|trait de c[ôo]te/i;
async function fetchCatalogue({ sig, com }) {
  if (!com) return [];
  const qs = [`${com.nom} risques`, `${com.nom} inondation`, `${com.nom} prévention des risques`, `${com.code}`];
  const res = await Promise.all(qs.map((q) => getJSON(`https://www.data.gouv.fr/api/1/datasets/?q=${encodeURIComponent(q)}&page_size=20`, sig).catch((e) => { if (e instanceof Cancelled) throw e; return { data: [] }; })));
  const nomRe = new RegExp(com.nom.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '.?'), 'i');
  const seen = new Map();
  for (const r of res) for (const d of (r && r.data) || []) {
    const txt = d.title + ' ' + (d.description || '').slice(0, 400);
    const plain = txt.normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (!STUDY_RE.test(txt)) continue;
    if (!nomRe.test(plain) && !plain.includes(com.code)) continue;
    if (!seen.has(d.id)) seen.set(d.id, { title: d.title, org: d.organization ? d.organization.name : '', page: d.page, maj: (d.last_update || d.last_modified || '').slice(0, 10) });
  }
  return [...seen.values()].sort((a, b) => (b.maj || '').localeCompare(a.maj || ''));
}

/* ---------- Procédures de la base GASPAR (API Géorisques) ---------- */
function normPPR(d, kind, insee) {
  const c = (d.communes || []).find((x) => x.codeInsee === insee) || {};
  const al = (c.aleas || []).map((a) => ({ lib: a.libelle, sous: (a.sousAlea || []).map((s) => s.libelle).filter(Boolean), presc: a.datePrescription, appro: a.dateApprobation, abrog: a.dateAbrog, annul: a.dateAnnulation, depresc: a.dateDeprescription, anticip: a.dateAppliAnt }));
  const any = (k) => al.find((a) => a[k]);
  let etat = 'En cours';
  if (any('annul')) etat = 'Annulé'; else if (any('abrog')) etat = 'Abrogé'; else if (any('depresc')) etat = 'Déprescrit';
  else if (any('appro')) etat = 'Approuvé'; else if (any('anticip')) etat = 'Appliqué par anticipation'; else if (any('presc')) etat = 'Prescrit';
  const appro = al.map((a) => a.appro).filter(Boolean).sort((a, b) => frToNum(b) - frToNum(a))[0] || '';
  const presc = al.map((a) => a.presc).filter(Boolean).sort((a, b) => frToNum(a) - frToNum(b))[0] || '';
  return { id: d.idGaspar, nom: d.libPpr, kind, modele: d.modeleProcedure, bassin: d.libBassinRisques, revision: !!d.etatRevision,
    zones: ((d.zonageReglementaire && d.zonageReglementaire.listTypeReg) || []).map((z) => ({ nom: z.nom, type: z.libelle })),
    lien: c.lienPpr || null, aleas: al, etat, appro, presc, maj: d.dateModification };
}
async function fetchProcedures({ sig, com }) {
  const out = [];
  await Promise.all(['pprn', 'pprt', 'pprm'].map(async (kind) => {
    const j = await getJSON(`${GR_API}gaspar/${kind}?codeInsee=${com.code}&page_size=50`, sig, 45000, true);
    const list = (j && j.content) || [];
    const det = await pool(list, 3, async (p) => {
      try { return await getJSON(`${GR_API}gaspar/${kind}/${encodeURIComponent(p.idGaspar)}`, sig, 45000); } catch (e) { if (e instanceof Cancelled) throw e; return p; }
    });
    det.forEach((d) => d && out.push(normPPR(d, kind, com.code)));
  }));
  return out;
}
// Exécute une requête secondaire avec son propre délai : en cas de lenteur, elle est abandonnée sans emporter le reste
async function withTimeout(sig, ms, fn) {
  const c = new AbortController(); const stop = () => c.abort();
  sig.addEventListener('abort', stop); const t = setTimeout(stop, ms);
  try { return await fn(c.signal); } catch (e) { if (sig.aborted) throw e; return null; } finally { clearTimeout(t); sig.removeEventListener('abort', stop); }
}
async function fetchGaspar({ sig, com }) {
  const one = async (path) => { try { const j = await getJSON(GR_API + path, sig, 30000, true); return (j && j.data) || []; } catch (e) { if (sig.aborted) throw e; return null; } };
  const [risques, tri, papi, azi, dicrim, tim, sism, radon, proc] = await Promise.all([
    one(`gaspar/risques?code_insee=${com.code}`), one(`gaspar/tri?code_insee=${com.code}`), one(`gaspar/papi?code_insee=${com.code}`),
    one(`gaspar/azi?code_insee=${com.code}`), one(`gaspar/dicrim?code_insee=${com.code}`), one(`gaspar/tim?code_insee=${com.code}`),
    one(`zonage_sismique?code_insee=${com.code}`), one(`radon?code_insee=${com.code}`), withTimeout(sig, 20000, (s2) => fetchProcedures({ sig: s2, com })),
  ]);
  return {
    risques: risques && risques[0] ? risques[0].risques_detail || [] : risques, tri, papi, azi, dicrim, tim, proc,
    sismique: sism && sism[0] ? sism[0] : null, radon: radon && radon[0] ? radon[0] : null,
  };
}

/* ---------- Installations nucléaires : rayon du plan particulier d'intervention ----------
   La couche de Géorisques donne la position des installations ; l'API donne,
   commune par commune, le rayon du PPI fixé par l'État. Le PPI le plus étendu
   (centrales) atteint 20 km : on cherche donc les installations dans cette marge. */
async function fetchNuclear({ bb, sig }) {
  const pts = await grWFS('INSTALLATIONS_NUCLEAIRES', padBox(bb, 20500), sig, 400);
  const coms = [...new Set(pts.map((f) => f.properties.insee_com).filter(Boolean))];
  const out = [];
  await pool(coms, 3, async (c) => {
    const j = await getJSON(`${GR_API}installations_nucleaires?code_insee=${c}&page_size=50`, sig, 45000, true);
    for (const x of Array.isArray(j) ? j : (j && j.data) || []) if (x.longitude != null && x.latitude != null) out.push(x);
  });
  return out;
}

  }).filter((e) => e.c);
}

/* ---------- Effet domino : le réseau routier face aux aléas ----------
   Le réseau des tronçons de route de la BD TOPO devient un graphe. Pour
   chaque scénario cartographié (surfaces des TRI, niveaux des cartes
   Vigicrues), les tronçons dont la chaussée entre dans la surface inondable
   sont retirés ; on observe alors ce qui reste relié à l'extérieur de la
   zone. Aucune donnée n'est ajoutée : seule la géométrie des sources
   officielles est croisée. Les ponts (tronçons au-dessus du sol) ne sont pas
   coupés par l'eau qui passe dessous. */
let NET = null;

const nodeKey = (c) => `${c[0].toFixed(6)},${c[1].toFixed(6)}`;
function lineLenM(l) { let d = 0; for (let i = 1; i < l.length; i++) d += distM(l[i - 1], l[i]); return d; }
function samplesOf(l) {
  const out = [l[0]];
  for (let i = 1; i < l.length; i++) {
    const a = l[i - 1], b = l[i], d = distM(a, b), n = Math.floor(d / SAMPLE);
    for (let k = 1; k <= n; k++) { const t = k / (n + 1); out.push([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]); }
    out.push(b);
  }
  return out;
}

/* ---------- Secteurs desservis par une seule voie ----------
   Un « pont » du graphe est un tronçon dont la suppression coupe le réseau en
   deux. Le côté qui ne rejoint aucune sortie ne communique avec le reste du
   territoire que par ce tronçon : impasse, lotissement ou hameau à accès unique. */
function singleExit() {
  const { nodes, edges } = NET, n = nodes.length;

  const comp = new Int32Array(n), roots = [];

  for (let r = 0; r < n; r++) {
    if (tin[r] !== -1) continue;
    roots.push(r); comp[r] = r;
    const stack = [[r, 0]]; tin[r] = low[r] = t++; hasExit[r] = nodes[r].exit ? 1 : 0;
    while (stack.length) {
      const top = stack[stack.length - 1], v = top[0];
      if (top[1] < nodes[v].e.length) {
        const ei = nodes[v].e[top[1]++]; if (ei === parentEdge[v]) continue;
        const e = edges[ei], w = e.a === v ? e.b : e.a;
        if (tin[w] === -1) { parentEdge[w] = ei; comp[w] = r; tin[w] = low[w] = t++; hasExit[w] = nodes[w].exit ? 1 : 0; stack.push([w, 0]); }
        else low[v] = Math.min(low[v], tin[w]);
      } else {
        stack.pop();
        if (stack.length) {
          const u = stack[stack.length - 1][0];
          low[u] = Math.min(low[u], low[v]); if (hasExit[v]) hasExit[u] = 1;

        }

  const order = [...Array(n).keys()].sort((a, b) => tin[a] - tin[b]);
  for (const v of order) { const pe = parentEdge[v]; if (pe < 0 || single[v]) continue; const e = edges[pe], u = e.a === v ? e.b : e.a; if (single[u]) single[v] = 1; }

  nodes.forEach((nd, i) => { nd.single = !!single[i] && !!hasExit[comp[i]]; });

}

/* ---------- Téléchargement de la carte avec sa légende ----------
   L'image reprend la vue affichée (fond IGN, cartes de Géorisques,
   couches de l'analyse), la légende complète, l'échelle, les sources et

const loadImg = (src) => new Promise((ok) => {

async function drawMap2d(ctx, W, H) {

  const pos = (el) => { const r = el.getBoundingClientRect(); return [r.left - box.left, r.top - box.top, r.width, r.height]; };

  tiles.forEach((t, i) => {
    if (!ims[i]) { miss++; return; }
    const [x, y, w, h] = pos(t);
    if (x > W || y > H || x + w < 0 || y + h < 0) return;
    ctx.globalAlpha = opacityOf(t, $('#map')); ctx.drawImage(ims[i], x, y, w, h);
  });

  for (const c of map.getPane('overlayPane').querySelectorAll('canvas')) { const [x, y, w, h] = pos(c); ctx.drawImage(c, x, y, w, h); }
  for (const m of map.getPane('markerPane').querySelectorAll('.leaflet-marker-icon')) {
    const d = m.firstElementChild || m, cs = getComputedStyle(d), [x, y, w, h] = pos(d);
    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
    ctx.fillStyle = cs.backgroundColor; ctx.fill(); ctx.lineWidth = parseFloat(cs.borderTopWidth) || 0;

  }

}
function drawMap3d(ctx, W, H) {
  return new Promise((ok) => {

    map3d.triggerRepaint();

// Dessine la légende ; renvoie la hauteur utilisée. Sans contexte de dessin, mesure seulement.
async function drawLegend(ctx, x0, y0, w) {
  const host = document.createElement('div');
  host.className = 'legend';
  host.style.cssText = `position:fixed;left:-10000px;top:0;width:${w}px;max-width:none;max-height:none;overflow:visible`;
  host.innerHTML = legendHTML();
  host.querySelectorAll('details').forEach((d) => { d.open = true; });
  document.body.appendChild(host);
  const imgs = new Map();
  await Promise.all([...host.querySelectorAll('img')].map(async (im) => imgs.set(im, await loadImg(im.src))));
  let y = y0;
  const text = (t, font, col, lh, indent = 0) => {
    ctx.font = font; ctx.fillStyle = col;
    for (const ln of wrapLines(ctx, t, w - indent)) { ctx.fillText(ln, x0 + indent, y + lh * 0.78); y += lh; }
  };
  const swatch = (i, x, yy) => {
    const cs = getComputedStyle(i);
    ctx.save(); ctx.globalAlpha = +cs.opacity;
    if (i.classList.contains('line')) {
      ctx.strokeStyle = cs.borderTopColor; ctx.lineWidth = parseFloat(cs.borderTopWidth) || 2;
      ctx.setLineDash(cs.borderTopStyle === 'dashed' ? [4, 3] : []);
      ctx.beginPath(); ctx.moveTo(x, yy + 6); ctx.lineTo(x + 15, yy + 6); ctx.stroke();
    } else {
      const pt = i.classList.contains('pt'), sw = pt ? parseFloat(cs.width) || 11 : 15, sh = pt ? sw : 11, bw = parseFloat(cs.borderTopWidth) || 0;
      ctx.beginPath();
      if (pt) ctx.arc(x + sw / 2, yy + 6, sw / 2, 0, Math.PI * 2); else ctx.rect(x, yy + 0.5, sw, sh);
      ctx.fillStyle = cs.backgroundColor; ctx.fill();
      if (bw) { ctx.lineWidth = bw; ctx.strokeStyle = cs.borderTopColor; ctx.setLineDash(cs.borderTopStyle === 'dashed' ? [3, 2] : []); ctx.stroke(); }
      if (i.textContent.trim()) { ctx.globalAlpha = 1; ctx.setLineDash([]); ctx.fillStyle = '#18211f'; ctx.font = '600 8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(i.textContent.trim(), x + sw / 2, yy + 9); ctx.textAlign = 'left'; }
    }
    ctx.restore();
  };
  const walk = (el) => {
    for (const n of el.childNodes) {
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'H4') { y += y > y0 ? 4 : 0; text(n.textContent.toUpperCase(), '600 10.5px sans-serif', '#66726b', 15); y += 3; }
      else if (tag === 'SUMMARY') text(n.textContent, '600 11.5px sans-serif', '#0f5b4f', 16);
      else if (tag === 'P') { text(n.textContent, '11.5px sans-serif', n.classList.contains('muted') ? '#66726b' : '#435049', 15); y += 4; }
      else if (tag === 'B') text(n.textContent, '600 12px sans-serif', '#18211f', 16);
      else if (tag === 'IMG') {
        const im = imgs.get(n);
        if (im && im.naturalWidth > 1) { const s = Math.min(1, w / im.naturalWidth), ih = im.naturalHeight * s; ctx.drawImage(im, x0, y + 2, im.naturalWidth * s, ih); y += ih + 8; }
        else text('Légende officielle indisponible : ' + (n.alt || ''), 'italic 11px sans-serif', '#66726b', 15);
      } else if (n.classList.contains('sep')) { ctx.fillStyle = '#dde2de'; ctx.fillRect(x0, y + 6, w, 1); y += 13; }
      else if (n.classList.contains('row')) {
        const i = n.querySelector('i'), yy = y;
        if (i) swatch(i, x0, yy + 2);
        const lab = [...n.childNodes].filter((c) => c !== i).map((c) => c.textContent).join('').trim();
        text(lab, '12px sans-serif', '#18211f', 16, 22); y += 2;
      } else walk(n);
    }
  };
  walk(host);
  host.remove();

}

  else if (Array.isArray(d) && d.length && d[0].type === 'Feature') feats = d;
  else if (Array.isArray(d) && d.length && d[0].longitude != null) feats = d.filter((x) => x.longitude != null && x.latitude != null).map(pt);
  if (feats) return { name: `resiterre_${slug()}_${k}.geojson`, text: JSON.stringify({ type: 'FeatureCollection', name: SRC[k].prod, features: feats.map((f) => ({ type: 'Feature', geometry: stripZ(f.geometry), properties: Object.fromEntries(Object.entries(f.properties || {}).filter(([, v]) => typeof v !== 'object' || v === null)) })) }), type: 'application/geo+json', n: feats.length };
  return { name: `resiterre_${slug()}_${k}.json`, text: JSON.stringify(d, null, 1), type: 'application/json', n: Array.isArray(d) ? d.length : 1 };
}

function tabMethode() {
  return `<h2>Méthode et limites</h2>
    <p class="lead">RésiTerre n'ajoute aucune donnée de son cru : il interroge les sources officielles, les superpose aux bâtiments de la BD TOPO et restitue ce que chacune dit, dans ses propres termes et ses propres classes.</p>
    <h3>Croisement</h3><ul>
      <li>Un bâtiment est rattaché à une zone (plan de prévention, surface inondable, classe d'argile, zone de PLU, carreau INSEE) quand son centre s'y trouve. Un grand bâtiment à cheval sur une limite peut donc n'être concerné qu'en partie.</li>
      <li>Pour les objets ponctuels ou linéaires (cavités, mouvements de terrain, canalisations, anciens sites industriels), la distance est mesurée depuis le centre du bâtiment, dans un rayon de recherche de ${R_PT} m ; pour les cours d'eau, dans un rayon de ${R_EAU} m. Ces rayons servent la lecture et ne correspondent à aucune zone réglementaire.</li>
      <li>La distance aux massifs soumis aux obligations légales de débroussaillement est comparée au seuil de ${R_OLD} m fixé par le code forestier ; la distance aux installations nucléaires, au rayon de leur plan particulier d'intervention publié par Géorisques.</li>
      <li>Les chiffres de population viennent des carreaux INSEE de 200 m : ils décrivent le carreau entier, jamais un bâtiment isolé.</li>
      <li>Aucune note ni aucun indice n'est calculé. Les lectures « Cumul des informations relevées » et « Vulnérabilités qui se cumulent » comptent des constats, sans les pondérer.</li>
      <li>Les objets reçus sont découpés à l'emprise analysée élargie de ${CLIP_PAD} m, marge supérieure à tous les rayons de recherche : les mesures restent identiques et les calculs beaucoup plus rapides.</li></ul>
    <h3>Réseau routier et accès</h3><ul>
      <li>Les tronçons de route de la BD TOPO sont chargés jusqu'à ${R_NET} m autour de la zone et reliés à leurs extrémités communes. Un carrefour situé à plus de ${R_EXIT} m de la zone compte comme une sortie vers le reste du territoire.</li>
      <li>Chaque tronçon est échantillonné tous les ${SAMPLE} m : il est coupé pour un scénario dès qu'un de ces points tombe dans la surface inondée (TRI) ou dans une zone inondée Vigicrues du niveau choisi. Les tronçons au-dessus du sol (ponts) ne sont jamais coupés.</li>
      <li>Un bâtiment est rattaché à la voie la plus proche, dans un rayon de ${R_ATT} m. Il est « coupé » si cette voie est sous l'eau, ou si plus aucun chemin praticable ne relie sa voie à une sortie.</li>
      <li>Le point sec le plus proche est le premier carrefour hors de la surface inondée atteint par le plus court chemin sur le réseau, avant l'arrivée de l'eau.</li>
      <li>Les secteurs à voie unique sont ceux que sépare du reste du réseau la coupure d'un seul tronçon (pont au sens de la théorie des graphes). Ils sont dits proches d'un massif boisé à moins de ${R_OLD} m d'un massif soumis aux obligations de débroussaillement, ou d'une forêt ou d'une lande de la BD TOPO ; les objets de nature « Bois », petites surfaces boisées souvent urbaines, ne sont pas retenus.</li>
      <li>Le niveau mesuré à la station vient de l'API Hub'eau, qui diffuse les données de Vigicrues ; il s'agit de données brutes, susceptibles d'être corrigées.</li></ul>
    <h3>Vulnérabilités qui se cumulent</h3><ul>
      <li>Huit facteurs, tous tirés des sources : au moins un aléa cartographié, plain-pied dans une surface inondable, établissement d'enseignement, de santé ou camping, accès coupé au scénario de référence (scénario moyen des TRI, à défaut premier niveau Vigicrues qui atteint un bâtiment), voie unique près d'un massif boisé, et trois parts de population du carreau INSEE supérieures à celles de l'ensemble de la zone analysée.</li>
      <li>Le classement des carreaux compte les facteurs distincts présents, puis départage par le nombre d'habitants.</li></ul>
    <h3>Jumeau numérique 3D</h3><ul>
      <li>Le relief vient de l'altimétrie de l'IGN (RGE ALTI, le sol nu). Les bâtiments sont élevés à leur hauteur dans la BD TOPO.</li>
      <li>L'eau d'un scénario prend pour épaisseur la borne basse de la classe de hauteur publiée par la source, à partir du sol ; une surface sans hauteur publiée est tracée en nappe mince. Ce n'est pas une modélisation hydraulique : la répartition de l'eau reste celle des cartes officielles.</li></ul>
    <h3>Limites</h3><ul>
      <li>Chaque donnée a sa date et son échelle : un zonage réalisé au 1/25 000 ne se lit pas à la parcelle. Le règlement d'un plan de prévention approuvé fait seul foi.</li>
      <li>L'absence d'information ne prouve pas l'absence d'aléa : de nombreux territoires n'ont ni TRI ni carte Vigicrues, et les inventaires de cavités et de mouvements de terrain restent incomplets.</li>
      <li>Les zonages détaillés des plans de prévention ne sont publiés en données ouvertes que dans une partie des départements ; ailleurs, seul le périmètre est croisé.</li>
      <li>Les informations communales (sismicité, radon, catastrophes naturelles, installations classées) valent pour toute la commune du centre de la zone.</li>
      <li>L'analyse porte sur ${MAX_KM2} km² et 15 000 bâtiments au plus. Une source secondaire qui n'a pas répondu après ${ALL_DEADLINE / 1000} s est abandonnée pour ne pas bloquer l'analyse ; elle est signalée dans l'onglet Données.</li></ul>
    <h3 id="about">À propos</h3>
    <p>RésiTerre est conçu et développé par <b>Mahel Chéour</b>, géographe diplômée du Master 2 Dynamiques des Milieux et des Risques de l'Université Paris 1 Panthéon-Sorbonne, spécialisée en risques naturels, SIG et jumeaux numériques territoriaux.</p>
    <p>Contact : <span class="mail">mahelchr@gmail.com</span></p>`;
}

    const r = impact(sc), s = r.st.get(b.i), w = waterAt(b, sc);
    h += `<li>${esc(sc.lbl)} : <b>${esc(stLbl(s).toLowerCase())}</b>${w ? `, ${htLbl(w).toLowerCase()} d'eau` : ''}${srcTag(sc.src, sc.kind === 'tri' ? 'TRI' : 'Vigicrues')}${srcTag('route', 'BD TOPO, routes')}</li>`;
    if (!b.att) h += `<li class="no">Aucune voie de la BD TOPO à moins de ${R_ATT} m : accès non évalué</li>`;
    else if (s === 'eau' || s === 'rue' || s === 'isole') {
      const d = dryRoute(sc, b);
      if (d && d.d < 25) h += '<li>Un carrefour hors de la surface inondée se trouve au pied du bâtiment</li>';
      else if (d) h += `<li>Point hors de la surface inondée le plus proche : <b>${mBest(d.d)} par la route</b>${d.names.length ? ` (${d.names.slice(0, 3).map(esc).join(', ')})` : ''}. <a href="#" data-dry="${b.i}">Montrer le trajet</a></li>`;

    }
  } else h += '<li class="no">Aucun scénario d\'inondation cartographié ici</li>';

}

function learnAnticipation() {

    <button class="card"><b>Îlot routier</b><span>Ensemble de rues encore au sec mais dont toutes les sorties passent sous l'eau. Ses habitants ne sont ni inondés ni joignables ; ils figurent rarement dans les plans d'évacuation.</span></button>
    <button class="card"><b>Voie unique</b><span>Accès dont la coupure sépare un secteur du reste du réseau. En cas de feu de forêt, la même route sert à l'évacuation et à l'arrivée des secours.</span></button>

const SAFETY_DOC = {
  enseignement: 'Établissement scolaire : son plan particulier de mise en sûreté (PPMS) organise l\'abri ou l\'évacuation des élèves face aux risques majeurs.',

async function crisisReport() {
  const list = S.E.filter((e) => e.bids.length).sort((a, b) => GROUPS.findIndex((g) => g.id === a.grp) - GROUPS.findIndex((g) => g.id === b.grp) || a.nom.localeCompare(b.nom));
  const title = `Fiches de crise : ${S.com ? S.com.nom : 'zone analysée'}`;
  const scs = NET ? NET.scen : [];
  const g = S.data.gaspar || {};
  const addr = await pool(list, 4, async (e) => { try { return await resolveAddress(S.B[e.bids[0]]); } catch (x) { return null; } });
  const page = (e, j) => {
    const bs = e.bids.map((i) => S.B[i]), a = addr[j];
    const grp = GROUPS.find((x) => x.id === e.grp);
    const rows = scs.map((sc) => {
      const r = impact(sc), sts = bs.map((b) => r.st.get(b.i));
      const s = sts.includes('eau') ? 'eau' : sts.includes('isole') ? 'isole' : sts.includes('rue') ? 'rue' : sts.every((x) => x === 'na') ? 'na' : 'ok';
      const w = bs.map((b) => waterAt(b, sc)).filter(Boolean).sort((x, y) => y[0] - x[0])[0];
      const et = r.etab.find((x) => x.x === e);
      return { sc, s, w, det: et && et.det };
    });
    const first = rows.find((x) => x.s !== 'ok' && x.s !== 'na');
    const dry = first ? bs.map((b) => dryRoute(first.sc, b)).filter(Boolean).sort((x, y) => x.d - y.d)[0] : null;
    const one = bs.some((b) => b.oneway), forest = bs.some(nearMassif);
    const vf = [...new Set(bs.flatMap((b) => b.v || []))];
    const docs = new Map(); for (const b of bs) for (const p of b.pm1.concat(b.pm3)) { const u = pprDoc(p); if (u) docs.set(u, pprTitle(p)); }
    const check = [];
    if (first) check.push(`Le site est ${first.s === 'eau' ? 'atteint' : 'coupé'} dès le scénario « ${esc(first.sc.lbl)} » : l'évacuation ou la mise à l'abri se décide avant ce niveau.`);
    if (rows.some((x) => x.s === 'eau') && bs.some((b) => b.et === 1)) check.push('Au moins un bâtiment est de plain-pied : vérifier l\'existence d\'un espace refuge au-dessus des plus hautes eaux.');
    if (dry) check.push(dry.d < 25 ? 'Un carrefour hors de la surface inondée se trouve au pied du site.' : `Itinéraire vers le point hors d'eau le plus proche : ${mBest(dry.d)} par ${dry.names.length ? dry.names.slice(0, 3).map(esc).join(', ') : 'la voirie locale'}.`);
    if (one && forest) check.push('Une seule voie dessert le site, près d\'un massif boisé : vérifier une seconde issue et le respect des obligations de débroussaillement.');
    else if (one) check.push('Une seule voie dessert le site : sa coupure isolerait l\'établissement.');
    return `<section class="crise"><h2>${esc(e.nom)}</h2>
      <p class="muted">${esc(e.nature)} · ${esc(grp ? grp.lbl : '')} · ${plural(bs.length, 'bâtiment')}${a ? ' · ' + esc(a.label) : ''} · ${bs[0].c[1].toFixed(5)} N, ${bs[0].c[0].toFixed(5)} E</p>
      <h3>Informations relevées par les sources</h3>${e.ind.length ? `<ul>${e.ind.map((k) => `<li>${esc(IND.find((x) => x.id === k).lbl)}</li>`).join('')}</ul>` : '<p class="muted">Aucune des informations croisées ne concerne ses bâtiments.</p>'}
      ${rows.length ? `<h3>Inondation : situation par scénario</h3><table><tr><th>Scénario</th><th>Situation</th><th>Hauteur d'eau publiée</th><th>Accès depuis l'extérieur</th></tr>${rows.map((x) => `<tr><td>${esc(x.sc.lbl)}</td><td>${esc(ST_LBL[x.s])}</td><td>${x.w ? esc(htLbl(x.w)) : '–'}</td><td>${x.s === 'ok' ? (x.det != null && x.det > 150 ? `détour de ${mBest(x.det)}` : 'inchangé') : x.s === 'na' ? '–' : 'coupé'}</td></tr>`).join('')}</table>` : '<p class="muted">Aucun scénario d\'inondation cartographié ne couvre le site.</p>'}
      ${vf.length ? `<h3>Facteurs de vulnérabilité</h3><ul>${vf.map((id) => `<li>${esc(VULN.find((v) => v.id === id).lbl)}</li>`).join('')}</ul>` : ''}
      ${check.length ? `<h3>Points à vérifier avec la commune</h3><ul>${check.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}
      <p class="note">${esc(SAFETY_DOC[e.grp] || '')}</p>
      <p>${link(grAddressReport(bs[0].c[0], bs[0].c[1], a ? a.label : '', S.com && S.com.code, S.com && S.com.nom), 'Rapport Géorisques à cette adresse')}${[...docs].map(([u, t]) => ' · ' + link(u, t)).join('')}</p></section>`;
  };
  const body = `<h1>${esc(title)}</h1>
    <p class="muted">${plural(list.length, 'établissement')} d'enseignement, de santé, de secours ou d'hébergement de plein air · analyse du ${S.when.toLocaleDateString('fr-FR')}</p>
    <div class="note">Une page par établissement : ce que disent les sources officielles, sa situation pour chaque scénario d'inondation cartographié (dans l'eau, accès coupé, quartier isolé), le point hors d'eau le plus proche par la route et ses voies de sortie. Ces fiches préparent un plan communal de sauvegarde ; elles ne remplacent ni les consignes des autorités ni les documents de sécurité propres à chaque établissement.</div>
    ${g.dicrim && g.dicrim.length ? `<p>La commune a publié un document d'information communal sur les risques majeurs (DICRIM)${g.dicrim[0].annee_publication ? ' en ' + esc(g.dicrim[0].annee_publication) : ''}.</p>` : ''}
    <p>${[lk('memento'), lk('vigicrues'), lk('preparer')].join(' · ')}</p>
    ${list.length ? list.map(page).join('') : '<p>Aucun établissement sensible recensé par la BD TOPO dans la zone.</p>'}
    <h2>Méthode</h2><ul><li>Les établissements sont les zones d'activité de la BD TOPO (enseignement, santé, secours, campings) ; leurs bâtiments sont ceux dont le centre se trouve dans leur emprise.</li><li>Une voie est coupée dès que sa chaussée entre dans la surface inondée du scénario ; les ponts restent praticables ; les sens uniques ne sont pas pris en compte.</li><li>Le détour se mesure par la route depuis la limite du réseau chargé, ${R_EXIT} m au-delà de la zone.</li></ul>
    <h2>Sources</h2>${sourcesTable()}`;
  return { title, body };
}

  st = setTimeout(async () => {
    try { sugg = ((await getJSON(`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(q)}&limit=6`, null, 15000)) || {}).features || []; sel = -1; drawSuggest(); }
    catch (e) { status('Recherche de lieu indisponible : ' + e.message); }
  }, 250);
});
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && sugg.length) { sel = (sel + 1) % sugg.length; drawSuggest(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && sugg.length) { sel = (sel - 1 + sugg.length) % sugg.length; drawSuggest(); e.preventDefault(); }
  else if (e.key === 'Enter' && sugg.length) { pickPlace(sugg[Math.max(0, sel)]); e.preventDefault(); }
  else if (e.key === 'Escape') { $('#suggest').hidden = true; }
});
document.addEventListener('click', (e) => { if (!e.target.closest('.searchrow')) $('#suggest').hidden = true; });
$('#about-link').addEventListener('click', (e) => { e.preventDefault(); openLearn('methode', 'about'); });

/* ---------- Démarrage : rien n'est lancé tant que l'utilisateur ne le demande pas ---------- */
(function init() {
  const m = location.hash.match(/^#(\d+(?:\.\d+)?)\/(-?\d+\.\d+)\/(-?\d+\.\d+)$/);
  if (m) map.setView([+m[2], +m[3]], +m[1]);
  lensClasses(); render(); legend(); zoneHint();
  status(m ? 'Vue partagée. Analyser cette zone lance le croisement.' : 'Cherchez un lieu, cadrez un quartier, puis lancez Analyser cette zone.');
})();
</script>
